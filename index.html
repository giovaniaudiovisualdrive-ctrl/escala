<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha agenda</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minha agenda">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#151517;--panel2:#1d1d20;--line:#2a2a2f;--text:#f2f2f3;--muted:#9a9aa3;--dim:#66666e;--accent:#c8161d;--brand:#9e0f1c;--ok:#1fbf75;--amber:#f5b83d;--red:#ff5b5f;--tema:#c8161d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden;font-family:Arial,sans-serif;font-size:21px;letter-spacing:-1px}.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:4px}.logo img~span{display:none}
h1{margin:0;font-size:20px}.sub{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.sub i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.next{border-color:rgba(200,22,29,.55);background:linear-gradient(180deg,rgba(200,22,29,.16),var(--panel))}
.next .l{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--accent);text-transform:uppercase}
.next h2{margin:6px 0 4px;font-size:22px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--line);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhd b{font-size:17px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.cd{aspect-ratio:1/1;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:default;position:relative;color:var(--muted)}
.cd.out{visibility:hidden}
.cd.work{color:#0b0f14;border:0}
.cd.today{box-shadow:0 0 0 2px var(--text)}
.cd{overflow:hidden;min-width:0}
.cd small{font-size:8px;font-weight:700;opacity:.85;max-width:100%;overflow:hidden;white-space:nowrap;padding:0 2px}
.cd.sel{outline:3px solid #fff;outline-offset:1px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.dt{width:58px;text-align:center;flex:none}.dt b{display:block;font-size:17px}.dt span{font-size:11px;color:var(--dim)}
.bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.row h4{margin:0;font-size:15px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1}
.tabs .on{border-color:var(--accent);color:var(--accent)}
.foot{color:var(--dim);font-size:11px;text-align:center;margin-top:20px}
.load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.flash{animation:fl 1.6s}@keyframes fl{0%{background:rgba(31,191,117,.35)}}
/* ponto */
.ponto h3{margin:0 0 10px;font-size:15px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);margin-top:8px}
.prow .g{flex:1;min-width:0}.prow b{display:block}
.btn.big{padding:12px 16px;font-size:15px;flex:1;justify-content:center}
.btn.out{background:var(--amber);border-color:var(--amber);color:#211500}
.pm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:20;padding:16px}
.pm .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(440px,100%);max-height:92vh;overflow:auto}
.pm h3{margin:0 0 4px}.pm label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:12px;text-transform:uppercase;letter-spacing:.4px}
.pm input,.pm select,.pm textarea{width:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text);font:inherit;font-size:16px}
.pm .acts{display:flex;gap:8px;margin-top:16px}.pm .acts .btn{flex:1;justify-content:center}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.calc div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:11px;color:var(--muted)}
.calc b{display:block;font-size:20px;color:var(--text)}
.msg-ok{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(31,191,117,.15);color:var(--ok);font-weight:600}
/* ---------- tema do mês ---------- */
.tema-faixa{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;font-weight:600;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tema) 28%,transparent),transparent);border:1px solid color-mix(in srgb,var(--tema) 45%,transparent)}
.tema-faixa .ico{font-size:22px;line-height:1}
.tema-bg{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;
  background:radial-gradient(circle at 85% -10%,color-mix(in srgb,var(--tema) 26%,transparent),transparent 55%),radial-gradient(circle at -10% 110%,rgba(200,22,29,.14),transparent 50%)}
.tema-bg span{position:absolute;top:-10vh;opacity:.13;animation:cair linear infinite;user-select:none}
@keyframes cair{to{transform:translateY(125vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){.tema-bg span{animation:none;top:auto}}
body{background:var(--bg)}
/* ---------- chat ---------- */
.chat-fab{position:fixed;right:16px;bottom:18px;z-index:15;background:var(--accent);color:#fff;border:0;border-radius:30px;padding:13px 18px;font:inherit;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;display:flex;gap:8px;align-items:center}
.chat-fab .n{background:#fff;color:var(--accent);border-radius:10px;padding:0 6px;font-size:12px}
.chat-box{position:fixed;inset:auto 12px 12px 12px;max-width:440px;margin-left:auto;height:min(78vh,620px);z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.chat-box.on{display:flex}
.chat-hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bolha{max-width:82%;padding:8px 11px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap;font-size:14px}
.bolha.eu{align-self:flex-end;background:rgba(200,22,29,.18)}.bolha.adm{align-self:flex-start;background:var(--panel2)}
.bolha small{display:block;color:var(--dim);font-size:10px;margin-top:3px}
.chat-ft{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chat-ft textarea,.chat-ft input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font:inherit;font-size:16px}
.atalhos{display:flex;gap:6px;flex-wrap:wrap}.atalhos button{font-size:12px;padding:5px 9px}
.msg-err{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,91,95,.15);color:var(--red);font-weight:600}
</style>
</head>
<body>
<div class="load" id="load"><div class="spin"></div></div>
<div class="pm" id="pm"></div>
<div class="tema-bg" id="temaBg"></div>
<div id="chatRoot"></div>
<div class="wrap" id="app"></div>
<script>
// Página pública (GitHub Pages). Lê os dados da planilha pelo App da Web, sem usar conta Google.
const API = 'https://script.google.com/macros/s/AKfycbzC4SQUnbGNWFK7xlj0xUKbmoMuGYWDN-8AExukFuHmepDC1JiEgVLS3FiH1KIrv9to/exec';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const LS_KEY = 'agenda_' + TOKEN;
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const PAL = ['#1fbf75','#4c9dff','#f5b83d','#a97cff','#19c2c2','#ff8a5c','#e86bb4','#9bd34a','#5ad1ff','#ffd166','#c49bff','#4fd1a5'];
const S = { ag: null, month: null, tab: 'next', sel: null, sig: '' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const col = s => { let h = 0; for (const c of norm(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
const P = iso => { const [y, m, d] = iso.split('-').map(Number); return { y, m: m - 1, d }; };
const f = iso => { const p = P(iso); return String(p.d).padStart(2, '0') + '/' + String(p.m + 1).padStart(2, '0'); };
const dow = iso => { const p = P(iso); return DOW[new Date(p.y, p.m, p.d).getDay()]; };
const tIso = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };

async function fetchAg() {
  if (!TOKEN) throw new Error('Link incompleto. Peça o seu link individual para a coordenação.');
  const r = await fetch(API + '?f=json&t=' + encodeURIComponent(TOKEN) + '&_=' + Date.now(), { credentials: 'omit', cache: 'no-store' });
  if (!r.ok) throw new Error('Não consegui carregar a agenda agora (erro ' + r.status + '). Tente de novo em instantes.');
  const d = await r.json();
  if (d.erro) throw new Error(d.erro);
  return d;
}
function baixarIcs() {
  const ag = S.ag, e = s => String(s || '').replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
  const nx = iso => { const p = P(iso); const d = new Date(p.y, p.m, p.d + 1); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Escala Tecnica//PT-BR', 'X-WR-CALNAME:' + e('Escala · ' + ag.nome)];
  ag.runs.forEach(r => L.push('BEGIN:VEVENT', 'UID:' + norm(r.evento + r.role + r.from).replace(/[^A-Z0-9]/g, '') + '@escala', 'DTSTAMP:20260101T000000Z',
    'DTSTART;VALUE=DATE:' + r.from.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + nx(r.to), 'SUMMARY:' + e(r.evento + ' · ' + r.role), 'LOCATION:' + e(r.local),
    'DESCRIPTION:' + e((r.os ? 'OS ' + r.os + '\n' : '') + r.days.map(d => f(d.date) + ' — ' + (d.phase || 'operação a definir')).join('\n')), 'END:VEVENT'));
  L.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar' }));
  a.download = 'minha-agenda.ics'; document.body.appendChild(a); a.click(); a.remove();
}
async function refresh(first) {
  // abre na hora com a última agenda guardada no celular; depois atualiza em segundo plano
  if (first && !S.ag) {
    try {
      const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      if (saved && saved.entries) {
        S.ag = saved; S.sig = JSON.stringify(saved.entries); S.month = tIso().slice(0, 7); S.syncing = true;
        render(false);
        document.getElementById('load').style.display = 'none';
      }
    } catch (e) { /* sem armazenamento: segue normal */ }
  }
  try {
    const ag = await fetchAg();
    const sig = JSON.stringify(ag.entries);
    const changed = S.sig && sig !== S.sig;
    S.ag = ag; S.sig = sig; S.syncing = false;
    try { localStorage.setItem(LS_KEY, JSON.stringify(ag)); } catch (e) { /* ignora */ }
    if (!S.month) { const t = tIso(); S.month = t.slice(0, 7); }
    render(changed);
  } catch (e) {
    if (S.ag) { S.syncing = false; render(false); }
    else document.getElementById('app').innerHTML = `<div class="empty">⚠ ${esc(e && e.message || e)}</div>`;
  }
  document.getElementById('load').style.display = 'none';
}
function render(changed) {
  const ag = S.ag, t = tIso();
  document.title = 'Agenda · ' + ag.nome;
  const future = ag.runs.filter(r => r.to >= t), past = ag.runs.filter(r => r.to < t).reverse();
  const next = future[0];
  const [y, m] = S.month.split('-').map(Number);
  const inM = ag.entries.filter(e => e.date.slice(0, 7) === S.month);
  const first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
  let cal = ['D','S','T','Q','Q','S','S'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < first; i++) cal += '<div class="cd out"></div>';
  for (let d = 1; d <= dim; d++) {
    const iso = `${S.month}-${String(d).padStart(2, '0')}`, es = inM.filter(e => e.date === iso);
    cal += `<div class="cd ${es.length ? 'work' : ''} ${iso === t ? 'today' : ''} ${S.sel === iso ? 'sel' : ''}" ${es.length ? `style="background:${col(es[0].evento)};cursor:pointer" onclick="S.sel='${iso}';render()"` : ''}>${d}${es.length ? `<small>${esc(es[0].evento.split(' ')[0].slice(0, 7))}</small>` : ''}</div>`;
  }
  const selList = S.sel ? ag.entries.filter(e => e.date === S.sel) : [];
  const rowHtml = r => `<div class="row"><div class="dt"><b>${f(r.from)}</b><span>${dow(r.from)}${r.from !== r.to ? ' → ' + f(r.to) : ''}</span></div><div class="bar" style="background:${col(r.evento)}"></div>
    <div><h4>${esc(r.evento)}</h4><div class="muted" style="font-size:13px">${esc(r.role)}${r.local ? ' · ' + esc(r.local) : ''}${r.os ? ' · ' + esc(r.os) : ''}</div>
    <div class="chips">${r.days.map(d => `<span class="chip">${f(d.date)} · ${esc(d.phase || 'a definir')}</span>`).join('')}</div></div></div>`;
  const list = S.tab === 'next' ? future : past;
  document.getElementById('app').innerHTML = `
  <header><div class="logo"><img src="logo.png" alt="" onerror="this.remove()"><span>bt</span></div><div><h1>${esc(ag.nome)}</h1><div class="sub"><i style="${S.syncing ? 'background:var(--amber)' : ''}"></i>${S.syncing ? 'Atualizando…' : 'Agenda ao vivo · atualizada às ' + new Date(ag.updatedAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div></div></header>
  ${faixaTema()}
  ${instalavel() ? `<button class="btn" style="width:100%;justify-content:center;margin-bottom:14px" onclick="instalarAgenda()">📲 Instalar na tela inicial do celular</button>` : ''}
  <div id="ponto">${pontoCardHtml()}</div>
  ${next ? `<div class="card next ${changed ? 'flash' : ''}"><div class="l">${next.from <= t ? 'Agora' : 'Próximo trabalho'}</div><h2>${esc(next.evento)}</h2>
    <div class="muted">${f(next.from)} (${dow(next.from)})${next.from !== next.to ? ' até ' + f(next.to) : ''} · ${esc(next.role)}${next.local ? ' · ' + esc(next.local) : ''}</div>
    <div class="chips">${next.days.map(d => `<span class="chip">${f(d.date)} · ${esc(d.phase || 'a definir')}</span>`).join('')}</div></div>` : `<div class="card"><b>Nenhum trabalho futuro marcado.</b></div>`}
  <div class="card ${changed ? 'flash' : ''}">
    <div class="calhd"><button class="btn" onclick="mv(-1)">‹</button><b>${icoMes(y, m)} ${MESES[m - 1]} ${y}</b><button class="btn" onclick="mv(1)">›</button></div>
    <div class="cal">${cal}</div>
    ${S.sel ? `<div class="list" style="margin-top:12px">${selList.map(e => `<div class="row"><div class="bar" style="background:${col(e.evento)}"></div><div><h4>${f(e.date)} · ${esc(e.evento)}</h4><div class="muted" style="font-size:13px">${esc(e.role)} · ${esc(e.phase || 'operação a definir')}${e.local ? ' · ' + esc(e.local) : ''}</div></div></div>`).join('')}</div>` : `<div class="dim" style="font-size:12px;margin-top:10px">${new Set(inM.map(e => e.date)).size} dia(s) de trabalho neste mês. Toque em um dia colorido para detalhes.</div>`}
  </div>
  <div class="card">
    <div class="tabs"><button class="btn ${S.tab === 'next' ? 'on' : ''}" onclick="S.tab='next';render()">Próximos (${future.length})</button><button class="btn ${S.tab === 'past' ? 'on' : ''}" onclick="S.tab='past';render()">Anteriores (${past.length})</button></div>
    <div class="list">${list.map(rowHtml).join('') || '<div class="empty">Nada aqui.</div>'}</div>
  </div>
  ${ag.runs.length ? `<button class="btn pri" style="width:100%;justify-content:center" onclick="baixarIcs()">📅 Adicionar ao meu calendário</button>` : ''}
  <div class="foot">Esta página se atualiza sozinha. Mudanças na escala aparecem aqui automaticamente.</div>`;
}
function mv(n) { const [y, m] = S.month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); S.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; S.sel = null; render(); }
/* ==================== PONTO (check-in / check-out) ==================== */
const EV = new URLSearchParams(location.search).get('e') || '';
const ALIM = ['Local forneceu', 'Pago pelo coordenador', 'Pago por mim', 'Não teve'];
async function apiGet(params) {
  const r = await fetch(API + '?' + new URLSearchParams(Object.assign({}, params, { _: Date.now() })), { credentials: 'omit', cache: 'no-store' });
  const d = await r.json(); if (d.erro) throw new Error(d.erro); return d;
}
async function apiPost(body) {
  const r = await fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const d = await r.json(); if (d.erro) throw new Error(d.erro); return d;
}
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fmtH = h => { const m = Math.round((+h || 0) * 60); return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); };
const calcHtml = c => c ? `<div class="calc"><div><b>${fmtH(c.horas)}</b>trabalhadas</div><div><b>${c.diarias}</b>diária${c.diarias > 1 ? 's' : ''}</div><div><b>${fmtH(c.extra)}</b>hora extra</div></div>` : '';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
function closeP() { document.getElementById('pm').style.display = 'none'; }
function pegarLocal() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => res(null), { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  });
}

/** Abre o formulário de check-in ou check-out. o = { acao, sub, evento, role, pedirNome, id, depois } */
function abrirPonto(o) {
  const opt = () => '<option value="">Selecione…</option>' + ALIM.map(a => `<option>${esc(a)}</option>`).join('');
  const el = document.getElementById('pm');
  el.innerHTML = `<div class="box"><h3>${o.acao === 'checkin' ? '✅ Check-in (entrada)' : '🏁 Check-out (saída)'}</h3><div class="muted" style="font-size:13px">${esc(o.sub || '')}</div>
    ${o.pedirNome ? `<label>Seu nome completo<input id="pNome" value="${esc(lsGet('ponto_nome') || '')}" autocomplete="name" placeholder="Ex.: JOÃO DA SILVA"></label>` : ''}
    <label>Horário<input id="pHora" type="datetime-local" value="${nowLocal()}"></label>
    ${o.acao === 'checkout' ? `<label>Almoço<select id="pAlm">${opt()}</select></label><label>Janta<select id="pJan">${opt()}</select></label>` : ''}
    <label>Observações<textarea id="pObs" rows="2" placeholder="Opcional"></textarea></label>
    <div class="muted" style="font-size:12px;margin-top:10px">📍 Sua localização atual será enviada junto${o.exigir ? ' <b>(obrigatória neste evento)</b>' : ''}. Permita o acesso quando o celular pedir.</div>
    <div id="pMsg"></div>
    <div class="acts" id="pActs"><button class="btn" onclick="closeP()">Cancelar</button><button class="btn pri" id="pGo">Confirmar</button></div></div>`;
  el.style.display = 'grid';
  document.getElementById('pGo').onclick = async () => {
    const msg = document.getElementById('pMsg'), go = document.getElementById('pGo');
    const body = { acao: o.acao, evento: o.evento, role: o.role || '', id: o.id || '', hora: document.getElementById('pHora').value, obs: document.getElementById('pObs').value };
    if (EV) body.e = EV; else body.t = TOKEN;
    if (o.pedirNome) { body.nome = document.getElementById('pNome').value.trim(); if (body.nome.length < 3) { msg.innerHTML = '<div class="msg-err">Digite seu nome completo.</div>'; return; } lsSet('ponto_nome', body.nome); }
    if (o.acao === 'checkout') {
      body.almoco = document.getElementById('pAlm').value; body.janta = document.getElementById('pJan').value;
      if (!body.almoco || !body.janta) { msg.innerHTML = '<div class="msg-err">Informe como foi o almoço e a janta.</div>'; return; }
    }
    go.disabled = true; go.textContent = '📍 Pegando localização…';
    body.loc = await pegarLocal();
    if (!body.loc && o.exigir) { msg.innerHTML = '<div class="msg-err">Não consegui sua localização. Ative o GPS/localização do celular, permita o acesso para este site e tente de novo.</div>'; go.disabled = false; go.textContent = 'Confirmar'; return; }
    go.textContent = 'Enviando…';
    try {
      const r = await apiPost(body);
      const key = 'ponto_open_' + (EV || o.evento);
      if (o.acao === 'checkin') lsSet(key, r.id); else lsSet(key, null);
      if (o.acao === 'checkout' && r.calc) {
        const hist = JSON.parse(lsGet('ponto_hist') || '[]'); hist.unshift({ ev: o.sub, in: r.in, out: r.out, calc: r.calc }); lsSet('ponto_hist', JSON.stringify(hist.slice(0, 10)));
      }
      msg.innerHTML = `<div class="msg-ok">${esc(r.msg)}</div>${calcHtml(r.calc)}`;
      document.getElementById('pActs').innerHTML = '<button class="btn pri" onclick="closeP()">OK</button>';
      if (o.depois) o.depois();
    } catch (e) {
      msg.innerHTML = `<div class="msg-err">⚠ ${esc(e.message || e)}</div>`; go.disabled = false; go.textContent = 'Confirmar';
    }
  };
}

/* ----- ponto dentro da agenda individual ----- */
function pontoCardHtml() {
  const p = S.ponto;
  if (!p) return `<div class="card ponto"><h3>⏱ Ponto de hoje</h3><div class="muted" style="font-size:13px">Carregando…</div></div>`;
  if (p.erro) return `<div class="card ponto"><h3>⏱ Ponto de hoje</h3><div class="muted" style="font-size:13px">⚠ ${esc(p.erro)}</div></div>`;
  const abertoKeys = p.abertos.map(a => a.key);
  const rows = [];
  window.PA = [];
  const act = o => { window.PA.push(o); return `abrirPonto(window.PA[${window.PA.length - 1}])`; };
  p.abertos.forEach(a => rows.push(`<div class="prow"><div class="g"><b>${esc(a.evento)}</b><span class="muted" style="font-size:12px">Entrada ${esc(a.in)} · em andamento</span></div>
    <button class="btn out" onclick="${act({ acao: 'checkout', sub: a.evento, evento: a.key, id: a.id, exigir: p.cfg.exigirLocal || !!(p.eventosHoje.find(x => x.key === a.key) || {}).exigir, depois: loadPonto })}">Check-out</button></div>`));
  p.eventosHoje.filter(e => !abertoKeys.includes(e.key)).forEach(e => rows.push(`<div class="prow"><div class="g"><b>${esc(e.evento)}</b><span class="muted" style="font-size:12px">${esc(e.role)}${e.local ? ' · ' + esc(e.local) : ''}</span></div>
    <button class="btn pri" onclick="${act({ acao: 'checkin', sub: e.evento, evento: e.key, role: e.role, exigir: !!e.exigir, depois: loadPonto })}">Check-in</button></div>`));
  const rec = p.recentes.slice(0, 3).map(r => `<div class="prow"><div class="g"><b>${esc(r.evento)}</b><span class="muted" style="font-size:12px">${esc(r.in)} → ${esc(r.out)}</span></div>
    <div style="text-align:right;font-size:12px"><b>${r.calc ? r.calc.diarias + ' diária' + (r.calc.diarias > 1 ? 's' : '') : ''}</b><span class="muted">${r.calc ? fmtH(r.calc.horas) + (r.calc.extra ? ' · HE ' + fmtH(r.calc.extra) : '') : ''}</span></div></div>`).join('');
  return `<div class="card ponto"><h3>⏱ Ponto de hoje</h3>${rows.join('') || '<div class="muted" style="font-size:13px">Nenhum evento seu hoje.</div>'}
    ${rec ? `<div class="muted" style="font-size:11px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px;font-weight:700">Últimos registros</div>${rec}` : ''}</div>`;
}
async function loadPonto() {
  try { S.ponto = await apiGet({ f: 'ponto', t: TOKEN }); } catch (e) { S.ponto = { erro: e.message || String(e) }; }
  const el = document.getElementById('ponto'); if (el) el.innerHTML = pontoCardHtml();
}

/* ----- administração do ponto (?a=) ----- */
const ADM = new URLSearchParams(location.search).get('a') || '';
const AD = { tab: 'reg', ev: '', q: '', d: null };
function copiar(t) {
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => avisar('📋 Copiado.'), () => prompt('Copie:', t));
  else prompt('Copie:', t);
}
function avisar(m) { const t = document.createElement('div'); t.className = 'msg-ok'; t.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
const mapa = s => { const m = String(s || '').match(/(-?\d+\.\d+),(-?\d+\.\d+)/); return m ? `<a href="https://www.google.com/maps?q=${m[1]},${m[2]}" target="_blank" style="text-decoration:none" title="${esc(s)}">📍</a>` : ''; };
async function admCarregar() { AD.d = await apiGet({ f: 'adm', a: ADM }); }
async function admPost(body) { return apiPost(Object.assign({ a: ADM }, body)); }
function admRegs() {
  const f = norm(AD.q);
  return AD.d.registros.filter(r => (!AD.ev || r.key === AD.ev) && (!f || norm([r.nome, r.evento, r.os].join(' ')).includes(f)));
}
function admCsv() {
  const q = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const L = [['DATA', 'NOME', 'EVENTO', 'OS', 'FUNÇÃO', 'ENTRADA', 'SAÍDA', 'HORAS', 'DIÁRIAS', 'HORA EXTRA', 'ALMOÇO', 'JANTA', 'OBSERVAÇÕES', 'ORIGEM', 'LOCALIZAÇÃO ENTRADA', 'LOCALIZAÇÃO SAÍDA', 'DISTÂNCIA (m)'].join(';')];
  admRegs().forEach(r => L.push([r.data, r.nome, r.evento, r.os, r.role, r.in, r.out, r.calc ? fmtH(r.calc.horas) : '', r.calc ? r.calc.diarias : '', r.calc ? fmtH(r.calc.extra) : '', r.almoco, r.janta, r.obs, r.origem, r.locIn, r.locOut, r.dist].map(q).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + L.join('\r\n')], { type: 'text/csv' }));
  const ev = AD.d.eventos.find(e => e.key === AD.ev);
  a.download = 'ponto' + (ev ? '-' + norm(ev.nome).replace(/[^A-Z0-9]+/g, '-').toLowerCase() : '') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

      <div class="pm" style="position:static;display:block;background:none;padding:0"><label>Horas de uma diária<input id="rB" type="number" step="0.5" value="${c.base}"></label>
      <label>Hora extra máxima antes da dobra (horas, ex.: 5.5 = 5h30)<input id="rL" type="number" step="0.25" value="${c.limite}"></label>
      <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--text)"><input id="rX" type="checkbox" style="width:auto;margin:0" ${c.exigirLocal ? 'checked' : ''}> Exigir localização no check-in em todos os eventos (dentro do raio do local, quando ele estiver cadastrado)</label>
      <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--text)"><input id="rC" type="checkbox" style="width:auto;margin:0" ${c.chat !== false ? 'checked' : ''}> 💬 Chat de atendimento ativo nos links dos técnicos</label></div>
      <button class="btn pri" style="margin-top:12px" id="rGo">Salvar regra</button></div>
      <div class="card"><h3 style="margin:0 0 6px;font-size:15px">Locais (endereço e raio)</h3>
      <div class="muted" style="font-size:12px">O nome precisa ser igual ao LOCAL que aparece no evento (ex.: BTT). O endereço vira coordenada sozinho.</div>
      ${D.locais.map((l, i) => `<div class="prow"><div class="g"><b>${esc(l.nome)}</b><span class="muted" style="font-size:12px">${esc(l.endereco)} · raio ${l.raio} m ${l.lat ? mapa(l.lat + ',' + l.lng) : ''}</span></div><button class="btn" onclick="admLocalExcluir(window.ALC[${i}].nome)">🗑</button></div>`).join('') || '<div class="muted" style="font-size:13px;margin-top:8px">Nenhum local cadastrado.</div>'}
      <div class="pm" style="position:static;display:block;background:none;padding:0">
        <label>Local<input id="lN" list="lNs" placeholder="Ex.: BTT"><datalist id="lNs">${nomesLocais.map(n => `<option value="${esc(n)}">`).join('')}</datalist></label>
        <label>Endereço completo<input id="lE" placeholder="Ex.: Rua Cecília Lottenberg, 50 - Santo Amaro, São Paulo"></label>
        <label>Raio permitido (metros)<input id="lR" type="number" value="50"></label></div>
      <div id="lMsg"></div><button class="btn pri" style="margin-top:12px" id="lGo">Salvar local</button></div>`;
  }
  app.style.maxWidth = '980px';
  app.innerHTML = `<header><div class="logo"><img src="logo.png" alt="" onerror="this.remove()"><span>bt</span></div><div><h1>Administração do ponto</h1><div class="sub">${esc(D.email)} · diária ${D.cfg.base} h · HE até ${fmtH(D.cfg.limite)}${D.cfg.exigirLocal ? ' · localização obrigatória' : ''}</div></div></header>
    <div class="tabs" style="flex-wrap:wrap">${tabs.map(([k, l]) => `<button class="btn ${AD.tab === k ? 'on' : ''}" onclick="AD.tab='${k}';admDraw()">${l}</button>`).join('')}</div>${body}
    <div class="foot">Acesso só ao ponto. Para mudar a escala, fale com a coordenação.</div>`;
  if (AD.tab === 'reg') {
    document.getElementById('fEv').onchange = e => { AD.ev = e.target.value; admDraw(); };
    const fq = document.getElementById('fQ'); fq.oninput = () => { AD.q = fq.value; const p = fq.selectionStart; admDraw(); const n = document.getElementById('fQ'); n.focus(); n.setSelectionRange(p, p); };
  }
  if (AD.tab === 'chat') {
    const b = document.getElementById('admMsgs'); if (b) b.scrollTop = b.scrollHeight;
    const t = document.getElementById('admTxt');
    if (t) {
      t.oninput = () => { AD.txt = t.value; };
      document.getElementById('admGoChat').onclick = async () => {
        if (!(AD.txt || '').trim()) return;
        try { AD.chat = await admPost({ acao: 'adm_chat_responder', c: AD.conv, texto: AD.txt }); AD.txt = ''; admDraw(); } catch (e) { alert(e.message || e); }
      };
    }
  }
  if (AD.tab === 'regra') {
    document.getElementById('rGo').onclick = async () => {
      try { await admPost({ acao: 'adm_regra', base: document.getElementById('rB').value, limite: document.getElementById('rL').value, exigir: document.getElementById('rX').checked, chat: document.getElementById('rC').checked }); avisar('✅ Regra salva.'); await admCarregar(); admDraw(); } catch (e) { alert(e.message || e); }
    };
    document.getElementById('lGo').onclick = async () => {
      const m = document.getElementById('lMsg'); m.innerHTML = '<div class="muted" style="margin-top:8px">Procurando o endereço no mapa…</div>';
      try { await admPost({ acao: 'adm_local', nome: document.getElementById('lN').value, endereco: document.getElementById('lE').value, raio: document.getElementById('lR').value }); avisar('✅ Local salvo.'); await admCarregar(); admDraw(); }
      catch (e) { m.innerHTML = `<div class="msg-err">⚠ ${esc(e.message || e)}</div>`; }
    };
  }
}
function admEvLocal(e) {
  const el = document.getElementById('pm');
  el.innerHTML = `<div class="box"><h3>📍 Local do check-in</h3><div class="muted" style="font-size:13px">${esc(e.nome)} · ${esc(e.start)} · ${esc(e.local)}</div>
    <label>Endereço do evento<input id="vEnd" value="${esc(e.cfgEndereco || '')}" placeholder="Rua, número, bairro, cidade"></label>
    <label>Raio permitido (metros)<input id="vRaio" type="number" value="${e.cfgRaio || 50}"></label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--text)"><input id="vEx" type="checkbox" style="width:auto;margin:0" ${e.cfgExigir ? 'checked' : ''}> Exigir localização neste evento</label>
    <div class="muted" style="font-size:12px;margin-top:8px">Com a opção marcada, o check-in e o check-out só são aceitos com o GPS da pessoa dentro do raio. Sem endereço próprio, vale o local cadastrado em “Regra e locais”.</div>
    <div id="vMsg"></div>
    <div class="acts"><button class="btn" onclick="closeP()">Cancelar</button><button class="btn pri" id="vGo">Salvar</button></div></div>`;
  el.style.display = 'grid';
  document.getElementById('vGo').onclick = async () => {
    const m = document.getElementById('vMsg'); m.innerHTML = '<div class="muted" style="margin-top:8px">Procurando o endereço no mapa…</div>';
    try { await admPost({ acao: 'adm_evento_local', key: e.key, endereco: document.getElementById('vEnd').value, raio: document.getElementById('vRaio').value, exigir: document.getElementById('vEx').checked });
      closeP(); avisar('✅ Local do evento salvo.'); await admCarregar(); admDraw(); }
    catch (err) { m.innerHTML = `<div class="msg-err">⚠ ${esc(err.message || err)}</div>`; }
  };
}
async function admLocalExcluir(nome) {
  if (!confirm('Remover o local ' + nome + '?')) return;
  try { await admPost({ acao: 'adm_local_excluir', nome }); await admCarregar(); admDraw(); } catch (e) { alert(e.message || e); }
}
async function admChatCarregar() {
  try { AD.chat = await apiGet({ f: 'chatadm', a: ADM, cv: AD.conv || '' }); } catch (e) { return; }
  const a = document.activeElement;
  if (AD.d && !(a && a.id === 'admTxt')) admDraw();
}
function admAbrirConv(c) { AD.conv = c; AD.txt = ''; AD.chat = Object.assign({}, AD.chat, { msgs: [] }); admDraw(); admChatCarregar(); }
async function initAdm() {
  document.title = 'Administração do ponto';
  try { await admCarregar(); admDraw(); admChatCarregar(); }
  catch (e) { document.getElementById('app').innerHTML = `<div class="empty">⚠ ${esc(e.message || e)}</div>`; }
  document.getElementById('load').style.display = 'none';
  setInterval(() => { if (!document.hidden) admChatCarregar(); }, AD.tab === 'chat' ? 10000 : 20000);
}

/* ==================== INSTALAR NA TELA INICIAL ==================== */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.ag) render(false); });
const jaInstalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const instalavel = () => !jaInstalado();
function instalarAgenda() {
  if (installEvt) { installEvt.prompt(); installEvt = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const el = document.getElementById('pm');
  el.innerHTML = `<div class="box"><h3>📲 Instalar a agenda</h3>
    ${ios ? '<p>No iPhone, abra este link no <b>Safari</b>, toque em <b>Compartilhar</b> (quadrado com seta ⬆) e depois em <b>Adicionar à Tela de Início</b>.</p>'
          : '<p>No Android, no <b>Chrome</b>: toque no menu <b>⋮</b> (canto superior) e depois em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>'}
    <p class="muted" style="font-size:13px">O ícone <b>bt</b> fica na tela do celular e abre direto na sua agenda, já atualizada.</p>
    <div class="acts"><button class="btn pri" onclick="closeP()">Entendi</button></div></div>`;
  el.style.display = 'grid';
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ==================== TEMA DO MÊS ==================== */
function temaDe(d) {
  const m = d.getMonth() + 1, dia = d.getDate();
  if (m === 1 && dia <= 10) return { cor: '#f5c542', ico: '🎆', txt: 'Feliz Ano Novo! Que venham grandes eventos.', chuva: ['✨', '🎉', '🥂'] };
  if (m === 1) return { cor: '#ffb703', ico: '☀️', txt: 'Janeiro de verão: hidrate-se nas montagens!', chuva: ['☀️', '🌊'] };
  if (m === 2) return { cor: '#c13cff', ico: '🎭', txt: 'Fevereiro de Carnaval: bom trabalho e boa folia!', chuva: ['🎉', '🎊', '🎭'] };
  if (m === 3) return { cor: '#e64980', ico: '🌷', txt: 'Março, mês da mulher: respeito e reconhecimento todos os dias.', chuva: ['🌷', '💐'] };
  if (m === 4) return { cor: '#b197fc', ico: '🐰', txt: 'Abril de Páscoa: renovação e boa energia na equipe.', chuva: ['🥚', '🐰', '🌼'] };
  if (m === 5) return { cor: '#f783ac', ico: '💐', txt: 'Maio, mês das mães e do trabalhador.', chuva: ['💐', '🌸'] };
  if (m === 6) return { cor: '#fd7e14', ico: '🎪', txt: 'Junho é Festa Junina: arraiá da base técnica!', chuva: ['🌽', '🔥', '🎏'] };
  if (m === 7) return { cor: '#4dabf7', ico: '❄️', txt: 'Julho de inverno: agasalhe-se nas madrugadas de montagem.', chuva: ['❄️', '☕'] };
  if (m === 8) return { cor: '#9775fa', ico: '💜', txt: 'Agosto Lilás: pelo fim da violência contra a mulher.', chuva: ['💜'] };
  if (m === 9) return { cor: '#fcc419', ico: '🎗️', txt: 'Setembro Amarelo: falar é a melhor solução. CVV 188.', chuva: ['💛', '🎗️'] };
  if (m === 10 && dia >= 25) return { cor: '#ff7b00', ico: '🎃', txt: 'Halloween chegando! Bom trabalho (sem sustos no palco).', chuva: ['🎃', '🦇', '🕸️'] };
  if (m === 10) return { cor: '#f06595', ico: '🎗️', txt: 'Outubro Rosa: prevenção do câncer de mama. Cuide-se!', chuva: ['🎗️', '💗'] };
  if (m === 11 && dia >= 13 && dia <= 21) return { cor: '#e9b949', ico: '✊🏾', txt: '20 de novembro: Dia da Consciência Negra.', chuva: ['✊🏾', '🌍'] };
  if (m === 11) return { cor: '#339af0', ico: '🎗️', txt: 'Novembro Azul: saúde do homem. Faça seus exames!', chuva: ['💙', '🎗️'] };
  if (m === 12 && dia >= 26) return { cor: '#f5c542', ico: '🎆', txt: 'Fim de ano! Obrigado pela temporada, equipe.', chuva: ['✨', '🎆', '🥂'] };
  return { cor: '#2f9e44', ico: '🎄', txt: 'Feliz Natal, equipe base técnica!', chuva: ['❄️', '🎄', '⭐'] };
}
const icoMes = (y, m) => temaDe(new Date(y, m - 1, 5)).ico;
function faixaTema() { const t = temaDe(new Date()); return `<div class="tema-faixa"><span class="ico">${t.ico}</span><span>${esc(t.txt)}</span></div>`; }
function aplicarTema() {
  const t = temaDe(new Date());
  document.documentElement.style.setProperty('--tema', t.cor);
  const bg = document.getElementById('temaBg'); if (!bg || bg.childElementCount) return;
  let h = '';
  for (let i = 0; i < 14; i++) h += `<span style="left:${(Math.random() * 100).toFixed(1)}%;font-size:${16 + Math.round(Math.random() * 22)}px;animation-duration:${14 + Math.round(Math.random() * 16)}s;animation-delay:-${Math.round(Math.random() * 25)}s">${t.chuva[i % t.chuva.length]}</span>`;
  bg.innerHTML = h;
}

/* ==================== CHAT DE ATENDIMENTO (técnico / freelancer) ==================== */
const CH = { aberto: false, msgs: [], ativo: false, ult: 0 };
const chKey = () => 'chat_visto_' + (TOKEN || EV);
function chatConv() {
  let c = lsGet('chat_c');
  if (!c) { c = Array.from(crypto.getRandomValues(new Uint8Array(14))).map(b => (b % 36).toString(36)).join(''); lsSet('chat_c', c); }
  return c;
}
const chatId = () => EV ? { e: EV, c: chatConv() } : { t: TOKEN };
async function chatCarregar() {
  try { const d = await apiGet(Object.assign({ f: 'chat' }, EV ? { e: EV, cv: chatConv() } : { t: TOKEN })); CH.ativo = d.ativo; CH.msgs = d.msgs || []; CH.ult = Date.now(); } catch (e) { /* offline */ }
  chatDesenhar(); chatEnviarFila();
}
function chatDesenhar() {
  const root = document.getElementById('chatRoot'); if (!root) return;
  if (!CH.ativo) { root.innerHTML = ''; return; }
  const visto = +(lsGet(chKey()) || 0);
  const n = CH.msgs.filter(m => m.de !== 'TÉCNICO' && m.ts > visto).length;
  if (!CH.aberto) { root.innerHTML = `<button class="chat-fab" onclick="chatAbrir()">💬 Atendimento${n ? ` <span class="n">${n}</span>` : ''}</button>`; return; }
  const txtAnt = (document.getElementById('chTxt') || {}).value || '', nomeAnt = (document.getElementById('chNome') || {}).value;
  const fila = JSON.parse(lsGet('chat_fila') || '[]');
  const pedeNome = EV && !(lsGet('ponto_nome') || '').trim();
  root.innerHTML = `<div class="chat-box on"><div class="chat-hd"><b style="flex:1">💬 Atendimento · coordenação</b><button class="btn" onclick="chatFechar()">✕</button></div>
    <div class="chat-msgs" id="chatMsgs">${CH.msgs.length || fila.length ? '' : '<div class="muted" style="font-size:13px">Fale direto com a coordenação: atraso, problema no check-in, localização, dúvidas. A resposta chega aqui.</div>'}
      ${CH.msgs.map(m => `<div class="bolha ${m.de === 'TÉCNICO' ? 'eu' : 'adm'}">${esc(m.texto)}<small>${m.de === 'TÉCNICO' ? 'Você' : 'Coordenação'} · ${esc(m.quando)}</small></div>`).join('')}
      ${fila.map(f => `<div class="bolha eu" style="opacity:.6">${esc(f.texto)}<small>⏳ aguardando internet para enviar…</small></div>`).join('')}</div>
    <div class="chat-ft">${pedeNome ? '<input id="chNome" placeholder="Seu nome completo" autocomplete="name">' : ''}
      <div class="atalhos">${['Vou me atrasar', 'Não consigo fazer o check-in', 'A localização não funciona', 'Estou sem internet no local', 'Tenho uma dúvida'].map(a => `<button class="btn" onclick="chatAtalho(this.textContent)">${a}</button>`).join('')}</div>
      <div style="display:flex;gap:8px"><textarea id="chTxt" rows="2" placeholder="Escreva sua mensagem…"></textarea><button class="btn pri" onclick="chatMandar()">Enviar</button></div></div></div>`;
  document.getElementById('chTxt').value = txtAnt;
  if (nomeAnt != null && document.getElementById('chNome')) document.getElementById('chNome').value = nomeAnt;
  const box = document.getElementById('chatMsgs'); box.scrollTop = box.scrollHeight;
  lsSet(chKey(), String(Date.now()));
}
function chatAtalho(t) { const x = document.getElementById('chTxt'); x.value = (x.value ? x.value + ' ' : '') + t + ': '; x.focus(); }
function chatAbrir() { CH.aberto = true; chatDesenhar(); chatCarregar(); }
function chatFechar() { CH.aberto = false; chatDesenhar(); }
async function chatMandar() {
  const nEl = document.getElementById('chNome');
  if (nEl) { const n = nEl.value.trim(); if (n.length < 3) return alert('Digite seu nome completo.'); lsSet('ponto_nome', n); }
  const t = document.getElementById('chTxt').value.trim(); if (!t) return;
  const fila = JSON.parse(lsGet('chat_fila') || '[]'); fila.push({ texto: t }); lsSet('chat_fila', JSON.stringify(fila));
  document.getElementById('chTxt').value = '';
  chatDesenhar(); await chatEnviarFila();
}
let chatEnviando = false;
async function chatEnviarFila() {
  if (chatEnviando) return;
  const fila = JSON.parse(lsGet('chat_fila') || '[]'); if (!fila.length) return;
  chatEnviando = true;
  try {
    while (fila.length) {
      const body = Object.assign({ acao: 'chat_enviar', texto: fila[0].texto, nome: lsGet('ponto_nome') || '' }, chatId());
      let d;
      try { d = await apiPost(body); }
      catch (e) { if (/fetch|network|Failed|Load failed/i.test(e.message || '')) throw e; alert('⚠ ' + (e.message || e)); d = null; }
      if (d && d.msgs) CH.msgs = d.msgs;
      fila.shift(); lsSet('chat_fila', JSON.stringify(fila));
    }
  } catch (e) { /* sem internet: fica na fila e tenta de novo */ }
  chatEnviando = false; chatDesenhar();
}
window.addEventListener('online', () => { chatEnviarFila(); chatCarregar(); });
function iniciarChat() {
  chatCarregar();
  setInterval(() => { if (!document.hidden && (CH.aberto || Date.now() - CH.ult > 60000)) chatCarregar(); }, 10000);
}

if (ADM) {
  initAdm();
} else if (EV) {
  aplicarTema();
  initEvento();
  iniciarChat();
} else {
  aplicarTema();
  iniciarChat();
  refresh(true);
  loadPonto();
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); loadPonto(); } });
}
</script>
</body>
