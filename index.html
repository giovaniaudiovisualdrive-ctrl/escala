<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha agenda</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minha agenda">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#151517;--panel2:#1d1d20;--line:#2a2a2f;--text:#f2f2f3;--muted:#9a9aa3;--dim:#66666e;--accent:#c8161d;--brand:#9e0f1c;--ok:#1fbf75;--amber:#f5b83d;--red:#ff5b5f;--tema:#c8161d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden;font-family:Arial,sans-serif;font-size:21px;letter-spacing:-1px}.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:4px}.logo img~span{display:none}
h1{margin:0;font-size:20px}.sub{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.sub i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.next{border-color:rgba(200,22,29,.55);background:linear-gradient(180deg,rgba(200,22,29,.16),var(--panel))}
.next .l{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--accent);text-transform:uppercase}
.next h2{margin:6px 0 4px;font-size:22px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--line);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhd b{font-size:17px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.cd{aspect-ratio:1/1;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:default;position:relative;color:var(--muted)}
.cd.out{visibility:hidden}
.cd.work{color:#0b0f14;border:0}
.cd.today{box-shadow:0 0 0 2px var(--text)}
.cd{overflow:hidden;min-width:0}
.cd small{font-size:8px;font-weight:700;opacity:.85;max-width:100%;overflow:hidden;white-space:nowrap;padding:0 2px}
.cd.sel{outline:3px solid #fff;outline-offset:1px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.dt{width:58px;text-align:center;flex:none}.dt b{display:block;font-size:17px}.dt span{font-size:11px;color:var(--dim)}
.bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.row h4{margin:0;font-size:15px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1}
.tabs .on{border-color:var(--accent);color:var(--accent)}
.foot{color:var(--dim);font-size:11px;text-align:center;margin-top:20px}
.load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
/* carregando: ícone do tema quicando como bola de borracha (amassa ao bater no chão) */
.load .quica{display:flex;flex-direction:column;align-items:center;gap:0}
.load .bola{font-size:56px;line-height:1;height:64px;transform-origin:50% 100%;animation:quica .95s infinite;will-change:transform}
.load .bola img{width:56px;height:56px;border-radius:14px}
.load .chao{width:54px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),rgba(255,255,255,0));margin-top:-6px;animation:sombra .95s infinite}
.load .ltxt{margin-top:18px;color:var(--muted);font-size:13px;opacity:0;transition:opacity .4s}
@keyframes quica{0%{transform:translateY(-78px) scale(1,1);animation-timing-function:cubic-bezier(.45,0,.9,.55)}
  46%{transform:translateY(0) scale(.94,1.06)}52%{transform:translateY(0) scale(1.32,.68);animation-timing-function:cubic-bezier(.1,.45,.55,1)}
  60%{transform:translateY(-14px) scale(.9,1.12)}100%{transform:translateY(-78px) scale(1,1)}}
@keyframes sombra{0%,100%{transform:scale(.45);opacity:.35}46%,58%{transform:scale(1.1);opacity:.8}}
@media (prefers-reduced-motion:reduce){.load .bola,.load .chao{animation-duration:2.4s}}
.flash{animation:fl 1.6s}@keyframes fl{0%{background:rgba(31,191,117,.35)}}
/* ponto */
.ponto h3{margin:0 0 10px;font-size:15px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);margin-top:8px}
.prow .g{flex:1;min-width:0}.prow b{display:block}
.btn.big{padding:12px 16px;font-size:15px;flex:1;justify-content:center}
.btn.out{background:var(--amber);border-color:var(--amber);color:#211500}
.pm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:20;padding:16px}
.pm .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(440px,100%);max-height:92vh;overflow:auto}
.pm h3{margin:0 0 4px}.pm label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:12px;text-transform:uppercase;letter-spacing:.4px}
.pm input,.pm select,.pm textarea{width:100%;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text);font:inherit;font-size:16px}
.card .pm{place-items:normal}
.pm .acts{display:flex;gap:8px;margin-top:16px}.pm .acts .btn{flex:1;justify-content:center}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.calc div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:11px;color:var(--muted)}
.calc b{display:block;font-size:20px;color:var(--text)}
.msg-ok{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(31,191,117,.15);color:var(--ok);font-weight:600}
/* ---------- tema do mês ---------- */
.tema-faixa{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;font-weight:600;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tema) 28%,transparent),transparent);border:1px solid color-mix(in srgb,var(--tema) 45%,transparent)}
.tema-faixa .ico{font-size:22px;line-height:1}
.tema-bg{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;
  background:radial-gradient(circle at 85% -10%,color-mix(in srgb,var(--tema) 26%,transparent),transparent 55%),radial-gradient(circle at -10% 110%,rgba(200,22,29,.14),transparent 50%)}
.tema-bg span{position:absolute;top:-10vh;opacity:.13;animation:cair linear infinite;user-select:none}
@keyframes cair{to{transform:translateY(125vh) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){.tema-bg span{animation:none;top:auto}}
body{background:var(--bg)}
/* ---------- chat ---------- */
.chat-fab{position:fixed;right:16px;bottom:18px;z-index:15;background:var(--accent);color:#fff;border:0;border-radius:30px;padding:13px 18px;font:inherit;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;display:flex;gap:8px;align-items:center}
.chat-fab .n{background:#fff;color:var(--accent);border-radius:10px;padding:0 6px;font-size:12px}
.chat-box{position:fixed;inset:auto 12px 12px 12px;max-width:440px;margin-left:auto;height:min(78vh,620px);z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.chat-box.on{display:flex}
.chat-hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bolha{max-width:82%;padding:8px 11px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap;font-size:14px}
.bolha.eu{align-self:flex-end;background:rgba(200,22,29,.18)}.bolha.adm{align-self:flex-start;background:var(--panel2)}
.bolha small{display:block;color:var(--dim);font-size:10px;margin-top:3px}
.chat-ft{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chat-ft textarea,.chat-ft input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font:inherit;font-size:16px}
.atalhos{display:flex;gap:6px;flex-wrap:wrap}.atalhos button{font-size:12px;padding:5px 9px}
.msg-err{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,91,95,.15);color:var(--red);font-weight:600}
/* ---------- QR Code ---------- */
.scan{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1;width:100%;margin-top:12px}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .mira{position:absolute;inset:15%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.pm .box.qrtela{width:min(520px,100%)}
.qrbox{background:#fff;border-radius:16px;padding:12px;margin:12px auto 6px;width:min(82vw,400px)}
.qrbox svg{display:block;width:100%;height:auto}
.qrcod{font:800 40px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-align:center}
.qrbar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:6px 0}.qrbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width 1s linear}
.nb{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--amber);color:#111;font-size:12px;font-weight:800;text-align:center;margin-left:4px}
.qrok{margin-bottom:14px;padding:10px 12px;border-radius:10px;background:rgba(31,191,117,.15);color:var(--ok);font-weight:600;font-size:13px}
/* alerta da coordenação (tela cheia) */
#alertaTela{position:fixed;inset:0;z-index:80;background:rgba(10,6,0,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;animation:alrIn .25s ease-out}
#alertaTela .ab{width:min(460px,100%);background:linear-gradient(var(--panel),var(--panel)),var(--bg);border:3px solid var(--amber);border-radius:20px;padding:22px 20px;text-align:center;box-shadow:0 0 0 0 rgba(245,184,61,.6);animation:alrPulso 1.4s infinite}
#alertaTela .ai{font-size:54px;line-height:1}
#alertaTela h2{margin:8px 0 4px;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
#alertaTela .at{font-size:24px;font-weight:800;line-height:1.25;margin:10px 0 12px;color:var(--text)}
#alertaTela .btn{width:100%;justify-content:center;font-size:17px;padding:14px;margin-top:14px}
@keyframes alrPulso{0%{box-shadow:0 0 0 0 rgba(245,184,61,.55)}70%{box-shadow:0 0 0 22px rgba(245,184,61,0)}100%{box-shadow:0 0 0 0 rgba(245,184,61,0)}}
@keyframes alrIn{from{opacity:0}to{opacity:1}}
.alr-frase{display:flex;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--panel2)}
.alr-frase.on{border-color:var(--amber);background:rgba(245,184,61,.12)}
.alr-frase span{flex:1;font-size:14px}
.btn.alr{background:#d9480f;border-color:#d9480f;color:#fff;font-size:18px;font-weight:800;padding:16px;width:100%;justify-content:center;margin-top:14px;letter-spacing:.5px}
#filaBar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column;gap:8px}
#filaBar .fila-it{background:var(--panel);border:1px solid var(--amber);border-left:5px solid var(--amber);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#filaBar .fila-it.err{border-color:var(--red);border-left-color:var(--red)}
#filaBar .fila-it .btn{align-self:flex-start;margin-top:4px;padding:6px 12px;font-size:12px}
/* ---------- tema claro / automático (Configurações → Aparência) ---------- */
:root[data-modo="claro"]{--bg:#f3f6f9;--panel:#ffffff;--panel2:#eef2f6;--line:#dbe2ea;--text:#17212c;--muted:#5a6879;--dim:#8a96a4;--amber:#b26e00;--ok:#18834a;--red:#c3352b;color-scheme:light}
@media (prefers-color-scheme: light){:root[data-modo="auto"]{--bg:#f3f6f9;--panel:#ffffff;--panel2:#eef2f6;--line:#dbe2ea;--text:#17212c;--muted:#5a6879;--dim:#8a96a4;--amber:#b26e00;--ok:#18834a;--red:#c3352b;color-scheme:light}}
:root[data-modo="claro"] .load .chao{background:radial-gradient(closest-side,rgba(0,0,0,.18),rgba(0,0,0,0))}
:root[data-semtema] .tema-bg span{display:none}
.logo img.vis{background:none;padding:0;object-fit:cover}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--text)}
.icoprev{width:72px;height:72px;border-radius:16px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);flex:none}
.icoprev img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="load" id="load"><div class="quica"><div class="bola" id="loadIco"><img src="icon-192.png" alt=""></div><div class="chao"></div><div class="ltxt" id="loadTxt">Conectando…</div></div></div>
<div class="pm" id="pm"></div>
<div class="tema-bg" id="temaBg"></div>
<div id="chatRoot"></div>
<div class="wrap" id="app"></div>
<script>
// Página pública (GitHub Pages). Lê os dados da planilha pelo App da Web, sem usar conta Google.
const API = 'https://script.google.com/macros/s/AKfycbzC4SQUnbGNWFK7xlj0xUKbmoMuGYWDN-8AExukFuHmepDC1JiEgVLS3FiH1KIrv9to/exec';
/* ---------- aparência (nome, ícone e tema), mudada pela ADM em ⚙ Configurações ---------- */
const VIS_PADRAO = { nome: 'Escala Técnica', sub: 'base técnica · vídeo', tema: 'escuro', cor: '#c8161d', temaMes: true, icone: '', v: '' };
let VIS = (() => { try { return Object.assign({}, VIS_PADRAO, JSON.parse(localStorage.getItem('bt_visual') || '{}')); } catch (e) { return Object.assign({}, VIS_PADRAO); } })();
const escV = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function corEscura(hex, f) { const n = parseInt(hex.slice(1), 16); const c = x => Math.max(0, Math.round(x * (f || 0.78))).toString(16).padStart(2, '0'); return '#' + c(n >> 16) + c((n >> 8) & 255) + c(n & 255); }
function logoHtml() { return VIS.icone ? `<div class="logo"><img class="vis" src="${VIS.icone}" alt=""></div>` : '<div class="logo"><img src="logo.png" alt="" onerror="this.remove()"><span>bt</span></div>'; }
function aplicarVisual() {
  const r = document.documentElement;
  r.dataset.modo = VIS.tema || 'escuro';
  r.style.setProperty('--accent', VIS.cor || VIS_PADRAO.cor); r.style.setProperty('--brand', corEscura(VIS.cor || VIS_PADRAO.cor));
  if (VIS.temaMes === false) { r.dataset.semtema = '1'; document.querySelectorAll('.tema-faixa').forEach(el => el.remove()); } else delete r.dataset.semtema;
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = VIS.tema === 'claro' ? '#f3f6f9' : '#0b0b0c';
  if (VIS.icone) ['icon', 'apple-touch-icon'].forEach(rel => { let l = document.querySelector(`link[rel="${rel}"]`); if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); } l.href = VIS.icone; });
  document.querySelectorAll('.logo').forEach(el => { if (!el.closest('.box')) el.outerHTML = logoHtml(); });
  document.querySelectorAll('[data-vis=nome]').forEach(el => { el.textContent = VIS.nome; });
  document.querySelectorAll('[data-vis=sub]').forEach(el => { el.textContent = VIS.sub; });
  if (/Escala Técnica/.test(document.title) && VIS.nome !== 'Escala Técnica') document.title = document.title.replace('Escala Técnica', VIS.nome);
}
aplicarVisual();
async function atualizarVisual() {
  try {
    const r = await fetch(API + '?' + new URLSearchParams({ f: 'visual', v: VIS.v || '', _: Date.now() }), { credentials: 'omit', cache: 'no-store' }).then(x => x.json());
    if (!r || r.erro || r.mesmo) return;
    VIS = Object.assign({}, VIS_PADRAO, r);
    try { localStorage.setItem('bt_visual', JSON.stringify(VIS)); } catch (e) { /* ícone grande demais para guardar: usa só nesta visita */ }
    aplicarVisual(); if (!new URLSearchParams(location.search).get('a') && typeof aplicarTema === 'function') aplicarTema();
  } catch (e) { /* sem internet: fica o que já tinha */ }
}
// ícone do carregamento conforme o tema do dia (Natal, Consciência Negra, Independência…)
try { if (VIS.icone) document.getElementById('loadIco').innerHTML = `<img src="${VIS.icone}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:22%">`; else if (VIS.temaMes !== false) { const t0 = temaDe(new Date()); document.getElementById('loadIco').textContent = t0.load || t0.ico; } } catch (e) { /* fica o logo */ }
setTimeout(() => { const l = document.getElementById('loadTxt'); if (l) l.style.opacity = 1; }, 2500);
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const LS_KEY = 'agenda_' + TOKEN;
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const PAL = ['#1fbf75','#4c9dff','#f5b83d','#a97cff','#19c2c2','#ff8a5c','#e86bb4','#9bd34a','#5ad1ff','#ffd166','#c49bff','#4fd1a5'];
const S = { ag: null, month: null, tab: 'next', sel: null, sig: '' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const col = s => { let h = 0; for (const c of norm(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
const P = iso => { const [y, m, d] = iso.split('-').map(Number); return { y, m: m - 1, d }; };
const f = iso => { const p = P(iso); return String(p.d).padStart(2, '0') + '/' + String(p.m + 1).padStart(2, '0'); };
const dow = iso => { const p = P(iso); return DOW[new Date(p.y, p.m, p.d).getDay()]; };
const tIso = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };

async function fetchAg() {
  if (!TOKEN) throw new Error('Link incompleto. Peça o seu link individual para a coordenação.');
  const r = await fetch(API + '?f=json&t=' + encodeURIComponent(TOKEN) + '&_=' + Date.now(), { credentials: 'omit', cache: 'no-store' });
  if (!r.ok) throw new Error('Não consegui carregar a agenda agora (erro ' + r.status + '). Tente de novo em instantes.');
  const d = await r.json();
  if (d.erro) throw new Error(d.erro);
  return d;
}
function baixarIcs() {

    <div class="muted" style="font-size:12px;margin-top:10px">📍 Sua localização atual será enviada junto${o.exigir ? ' <b>(obrigatória neste evento)</b>' : ''}. Permita o acesso quando o celular pedir.</div>
    <div id="pMsg"></div>
    <div class="acts" id="pActs"><button class="btn" onclick="closeP()">Cancelar</button><button class="btn pri" id="pGo">Confirmar</button></div></div>`;
  el.style.display = 'grid';
  const sd = document.getElementById('pDia');
  if (sd) sd.onchange = () => {   // troca o dia sem perder o que já foi digitado
    const ids = ['pNome', 'pRole', 'pObs', 'pAlm', 'pJan'], vals = {};
    ids.forEach(i => { const x = document.getElementById(i); if (x) vals[i] = x.value; });
    abrirPonto(Object.assign({}, o, { diaEsc: sd.value }));
    ids.forEach(i => { const x = document.getElementById(i); if (x && vals[i] != null) x.value = vals[i]; });
  };
  const ab = document.getElementById('pAb');
  if (ab) ab.onchange = () => { document.getElementById('pNomeL').style.display = ab.value === '__outro' ? '' : 'none'; };
  document.getElementById('pGo').onclick = async () => {
    const msg = document.getElementById('pMsg'), go = document.getElementById('pGo');
    const hr = document.getElementById('pHora'), rl = document.getElementById('pRole');
    const body = { acao: o.acao, motorista: !!o.motorista, evento: o.evento, role: rl ? rl.value.trim().toUpperCase() : (o.role || ''), id: o.id || '', hora: hr ? hr.value : '', obs: document.getElementById('pObs').value, passe: o.passe || '' };
    if (o.e) body.e = o.e; else if (EV) body.e = EV; else body.t = TOKEN;
    if (diaSel && (o.acao === 'checkin' || o.dia)) body.dia = diaSel;
    const po = document.getElementById('pOut'), saida = po && po.value ? po.value : '';
    if (passado && !body.hora) { msg.innerHTML = '<div class="msg-err">Coloque o horário de entrada do dia ' + diaBr(diaSel) + '.</div>'; return; }
    if (body.dia && body.hora && body.hora.slice(0, 10) !== body.dia && o.acao === 'checkin') { msg.innerHTML = '<div class="msg-err">A entrada precisa ser no dia ' + diaBr(body.dia) + '.</div>'; return; }
    if (o.acao === 'checkin' && !body.role) { msg.innerHTML = '<div class="msg-err">Informe a sua função (ex.: LED, PPT, VMIX, APOIO).</div>'; return; }
    if (rl) lsSet('ponto_funcao', body.role);
    if (ab && ab.value && ab.value !== '__outro') { body.id = ab.value; body.nome = (o.abertos.find(a => a.id === ab.value) || {}).nome || ''; }
    else if (ab && !ab.value) { msg.innerHTML = '<div class="msg-err">Selecione o seu nome na lista.</div>'; return; }
    else if (o.pedirNome) { body.nome = document.getElementById('pNome').value.trim(); if (body.nome.length < 3) { msg.innerHTML = '<div class="msg-err">Digite seu nome completo.</div>'; return; } lsSet('ponto_nome', body.nome); }
    if (o.acao === 'checkout' || saida) {
      body.almoco = document.getElementById('pAlm').value; body.janta = document.getElementById('pJan').value;
      if (!body.almoco || !body.janta) { msg.innerHTML = '<div class="msg-err">Informe como foi o almoço e a janta.</div>'; return; }
    }
    if (saida && !(saida > body.hora)) { msg.innerHTML = '<div class="msg-err">A saída precisa ser depois da entrada.</div>'; return; }
    go.disabled = true; go.textContent = '📍 Pegando localização…'; msg.innerHTML = '';
    // sem exigência: tenta rápido e segue mesmo sem GPS; com exigência: espera mais e explica o que fazer
    const L = await pegarLocal(o.exigir ? 20000 : 8000);
    body.loc = L.loc || null;
    if (!body.loc && o.exigir) { msg.innerHTML = `<div class="msg-err">${esc(L.erro)}</div>`; go.disabled = false; go.textContent = 'Tentar de novo'; return; }
    go.textContent = 'Enviando…';
    if (o.qrCod) { body.qr = o.qrCod; body.qrEm = o.qrEm; }   // se o passe vencer até a internet voltar, o servidor confere o código pela hora da leitura
    if (!body.hora) body.hora = nowLocal();   // a hora é a do toque, mesmo que o envio atrase
    body.fid = novoFid();
    const rotulo = (o.acao === 'checkin' ? 'Check-in' : 'Check-out') + ' · ' + (o.sub || '') + (body.nome ? ' · ' + body.nome : '');
    let fase = 1;
    try {
      // o que ficou guardado sem sinal vai antes (a ordem importa: check-in antes do check-out)
      if (filaLer().length) { await filaEnviar(); if (filaLer().length) throw semRedeErr(); }
      let r = await apiPost(body);
      fase = 2;
      if (saida && r.id) {   // dia que já passou com entrada e saída: fecha o mesmo registro
        const b2 = Object.assign({}, body, { acao: 'checkout', id: r.id, hora: saida, fid: novoFid() });
        const r2 = await apiPost(b2);
        r = Object.assign({}, r2, { msg: 'Dia ' + diaBr(body.dia) + ' registrado: ' + r2.in + ' → ' + r2.out + '.' + (r2.pend ? ' ⏳ Vai para o responsável confirmar.' : '') });
        o.acao = 'checkout';
      }
      const key = 'ponto_open_' + (EV || o.evento);
      if (o.acao === 'checkin') lsSet(key, r.id); else lsSet(key, null);
      if (o.acao === 'checkout' && r.calc) {
        const hist = JSON.parse(lsGet('ponto_hist') || '[]'); hist.unshift({ ev: o.sub, in: r.in, out: r.out, calc: r.calc }); lsSet('ponto_hist', JSON.stringify(hist.slice(0, 10)));
      }
      msg.innerHTML = `<div class="msg-ok">${esc(r.msg)}</div>${calcHtml(r.calc)}${avisarHtml(r.avisar)}` +
        (o.acao === 'checkout' ? `<button class="btn" id="pRel" style="width:100%;justify-content:center;margin-top:10px">📄 Relatório de horas deste evento</button>` : '');
      const pr = document.getElementById('pRel');
      if (pr) pr.onclick = () => abrirRelatorio(body.t ? { t: body.t, ev: o.evento } : { e: body.e, nome: body.nome || (o.abertos && o.abertos.find(a => a.id === body.id) || {}).nome || lsGet('ponto_nome') || '' });
      document.getElementById('pActs').innerHTML = '<button class="btn pri" onclick="closeP()">OK</button>';
      if (o.depois) o.depois();
    } catch (e) {
      if (e.semRede) {   // sem sinal: guarda no celular com a hora do toque e envia sozinho depois
        const sem = Object.assign({}, body, { semSinal: true });
        if (fase === 1) filaAdd({ body: sem, rotulo, evento: o.evento || '', acao: o.acao, dia: body.dia || (body.hora || '').slice(0, 10), hora: body.hora });
        if (saida) filaAdd({ body: Object.assign({}, sem, { acao: 'checkout', id: '', hora: saida, fid: novoFid() }), rotulo: 'Check-out · ' + (o.sub || ''), evento: o.evento || '', acao: 'checkout', dia: body.dia, hora: saida });
        msg.innerHTML = `<div class="msg-ok" style="background:rgba(245,184,61,.15);color:var(--amber);border-color:var(--amber)">📶 Sem sinal agora. O ${o.acao === 'checkin' && !saida ? 'check-in' : 'registro'} das ${esc((body.hora || '').slice(11, 16))} ficou <b>guardado no celular</b> e vai ser enviado sozinho quando a internet voltar. Não precisa fazer de novo.</div>`;
        document.getElementById('pActs').innerHTML = '<button class="btn pri" onclick="closeP()">OK</button>';
        if (o.depois) o.depois();
        return;
      }
      const dica = body.loc && body.loc.acc > 300 && /m do local/.test(e.message || '') ? (IOS ? ' Sua localização veio imprecisa (±' + body.loc.acc + ' m): ligue "Localização Precisa" em Ajustes → Privacidade e Segurança → Serviços de Localização → Sites do Safari.' : ' Sua localização veio imprecisa (±' + body.loc.acc + ' m): ligue o GPS em alta precisão.') : '';
      msg.innerHTML = `<div class="msg-err">⚠ ${esc((e.message || e) + dica)}</div>`; go.disabled = false; go.textContent = 'Tentar de novo';
    }
  };
}

function pontoCardHtml() {
  const p = S.ponto;
  if (!p) return `<div class="card ponto"><h3>⏱ Horário de hoje</h3><div class="muted" style="font-size:13px">Carregando…</div></div>`;
  if (p.erro) return `<div class="card ponto"><h3>⏱ Horário de hoje</h3><div class="muted" style="font-size:13px">⚠ ${esc(p.erro)}</div></div>`;
  const hojeP = p.hoje || nowLocal().slice(0, 10);

  const filaP = filaLer().filter(x => x.evento && x.body && x.body.t === TOKEN);

    p.abertos = p.abertos.concat([{ id: '', key: x.evento, evento: (x.rotulo || '').replace(/^Check-in · /, '').split(' · ')[0], dia: x.dia, in: (x.hora || '').slice(11, 16) + ' (guardado sem sinal)', qr: false, exigir: false }]); });
  const abertoKeys = p.abertos.filter(a => !a.dia || a.dia === hojeP).map(a => a.key);   // só o aberto de hoje esconde o check-in de hoje

  const corr = corrHtml(p.correcoes, '{ t: TOKEN }', 'loadPonto', false);
  const espera = c => c && (c.in === SIT_AG || c.out === SIT_AG) ? ' · ⏳ aguardando o responsável confirmar o horário' : '';

    <button class="btn out" onclick="${act({ acao: 'checkout', sub: a.evento + (a.dia ? ' · dia ' + diaBr(a.dia) : ''), evento: a.key, id: a.id, dia: a.dia || '', qr: !!a.qr, exigir: p.cfg.exigirLocal || !!a.exigir || !!(p.eventosHoje.find(x => x.key === a.key) || {}).exigir, depois: loadPonto })}">${a.qr ? '▣ ' : ''}Check-out</button></div>`));

    <div style="display:flex;flex-direction:column;gap:6px"><button class="btn pri" onclick="${act({ acao: 'checkin', sub: e.evento, evento: e.key, role: e.role, dia: p.hoje || '', qr: !!e.qr, exigir: !!e.exigir, depois: loadPonto })}">${e.qr ? '▣ ' : ''}Check-in</button>
    ${e.motorista ? `<button class="btn" onclick="abrirPonto(window.PA[${window.PA.push({ acao: 'checkin', motorista: true, sub: e.evento, evento: e.key, role: e.role, exigir: false, depois: loadPonto }) - 1}])">🚐 Motorista</button>` : ''}</div></div>`));
  (p.diasPendentes || []).forEach(d => rows.push(`<div class="prow"><div class="g"><b>${esc(d.evento)} · ${esc(d.diaBr)}</b><span class="muted" style="font-size:12px;color:var(--amber)">⚠ Dia escalado sem registro (falta entrada e saída)</span></div>
    <button class="btn" onclick="${act({ acao: 'checkin', sub: d.evento + ' · dia ' + d.diaBr, evento: d.key, role: d.role, dia: d.dia, qr: !!d.qr, exigir: !!d.exigir, depois: loadPonto })}">${d.qr ? '▣ ' : ''}Registrar dia</button></div>`));
  const rec = p.recentes.slice(0, 3).map(r => `<div class="prow"><div class="g"><b>${esc(r.evento)}</b><span class="muted" style="font-size:12px">${esc(r.in)} → ${esc(r.out)}</span></div>

async function loadPonto() {
  try { S.ponto = await apiGet({ f: 'ponto', t: TOKEN }); lsSet('pt_' + TOKEN, JSON.stringify(S.ponto)); }
  catch (e) {
    let c = null; try { c = JSON.parse(lsGet('pt_' + TOKEN) || 'null'); } catch (x) {}
    // sem sinal: usa o último ponto guardado, se for de hoje (dá para registrar e o envio fica na fila)
    if (e.semRede && c && c.hoje === nowLocal().slice(0, 10)) { S.ponto = c; S.ponto.semSinal = true; }
    else S.ponto = { erro: e.message || String(e) };

}

  }
  const passeOk = () => PASSE_EV && PASSE_EV.ate > Date.now() + 20000 ? PASSE_EV.passe : '';

/** Imagem escolhida → data URL pequena: GIF fica como está (mantém a animação); as outras viram PNG 256×256. */
function prepararIcone(f) {
  return new Promise((ok, erro) => {
    const rd = new FileReader();
    rd.onerror = () => erro(new Error('Não consegui ler a imagem.'));
    rd.onload = () => {
      const url = rd.result;
      if (f.type === 'image/gif') { if (url.length > 380000) return erro(new Error('GIF grande demais (' + Math.round(f.size / 1024) + ' KB). Use um de até 280 KB.')); return ok(url); }
      const im = new Image();
      im.onerror = () => erro(new Error('Imagem inválida.'));
      im.onload = () => {
        const n = 256, cv = document.createElement('canvas'); cv.width = cv.height = n;
        const k = Math.max(n / im.width, n / im.height), w = im.width * k, h = im.height * k;
        cv.getContext('2d').drawImage(im, (n - w) / 2, (n - h) / 2, w, h);
        let out = cv.toDataURL('image/png');
        if (out.length > 380000) out = cv.toDataURL('image/webp', 0.9);
        ok(out);
      };
      im.src = url;
    };
    rd.readAsDataURL(f);
  });
}

async function initAdm() {

/* ----- cadastro do técnico (?r=): link que a administração manda pelo WhatsApp ----- */
const CADR = new URLSearchParams(location.search).get('r') || '';
const soDig = s => String(s || '').replace(/\D/g, '');
function mascara(el, tipo) {
  el.addEventListener('input', () => {
    let d = soDig(el.value);
    if (tipo === 'cpf') { d = d.slice(0, 11); el.value = d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); }
    if (tipo === 'cnpj') { d = d.slice(0, 14); el.value = d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2'); }
    if (tipo === 'tel') { d = d.slice(0, 11); el.value = d.length > 10 ? d.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3') : d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3').replace(/[-(]\s*$/, ''); }
  });
}

        ${campo('fCont', 'Nome do contato de emergência', 'autocapitalize="words"', false, P.contato)}
        ${campo('fPix', 'PIX (chave)', 'placeholder="CPF, celular, e-mail ou chave aleatória"', true, P.pix)}

        <button class="btn big" style="width:100%;justify-content:center;margin-top:8px" onclick="abrirConferir({ c: COORD, ev: window.CE[${i}].key, depois: window.COORD_RELOAD })">⏱ Conferir horários${ag ? ` <span class="nb">${ag}</span>` : ''}</button>
        <div class="muted" style="font-size:12px;margin-top:6px">⚙ ${esc(e.regra ? e.regra.txt : '')} · mude em “Conferir horários”.</div>
        ${alertasHtml(e.alertas)}
        ${ped ? `<div class="muted" style="font-size:12px;margin-top:6px">↩ ${ped} correção(ões) pedida(s): aguardando a pessoa mandar o horário certo.</div>` : ''}
        <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1;justify-content:center" onclick="coordPonto(${i},'checkin')">✅ Meu check-in</button><button class="btn out" style="flex:1;justify-content:center" onclick="coordPonto(${i},'checkout')">🏁 Meu check-out</button></div></div>`; }).join('') || '<div class="card muted">Nenhum evento seu hoje.</div>'}
      ${prox.length ? `<div class="card"><h3 style="margin:0 0 6px;font-size:15px">Próximos eventos</h3>${prox.map(e => `<div class="prow"><div class="g"><b>${esc(e.nome)}</b><span class="muted" style="font-size:12px">${esc(e.start)}${e.end !== e.start ? ' a ' + esc(e.end) : ''}${e.local ? ' · ' + esc(e.local) : ''}</span></div></div>`).join('')}<div class="muted" style="font-size:12px;margin-top:6px">O QR Code de cada evento aparece aqui a partir da véspera.</div></div>` : ''}
      ${instalavel() ? '<button class="btn" style="width:100%;justify-content:center" onclick="instalarAgenda()">📲 Salvar na tela inicial</button>' : ''}
      <div class="foot">Este link é só seu: não compartilhe. Ele para de funcionar quando a administração tirar você do evento.</div>`;
  };
  window.COORD_RELOAD = async () => { try { await carregar(); } catch (e) { /* mantém */ } if (D) { draw(); alertaNovo(D.eventos.reduce((n, e) => n + e.conferir.filter(x => x.sit === SIT_AG).length, 0), 'coord'); alerta12h([].concat(...D.eventos.map(e => e.alertas || [])), 'coord'); } };
  window.coordPonto = (i, acao) => {
    const e = D.eventos[i];
    const o = { acao, sub: e.nome, evento: e.key, e: e.e, passe: e.passe, coord: true, pedirNome: true, nome: D.nome, exigir: e.exigir, depois: window.COORD_RELOAD };
    if (acao === 'checkout') { o.abertos = e.abertos; o.id = lsGet('ponto_open_' + e.key) || ''; }
    abrirPonto(o);
  };
  try { await carregar(); draw(); alertaNovo(D.eventos.reduce((n, e) => n + e.conferir.filter(x => x.sit === SIT_AG).length, 0), 'coord'); alerta12h([].concat(...D.eventos.map(e => e.alertas || [])), 'coord'); }
  catch (err) { app.innerHTML = `<div class="empty">⚠ ${esc(err.message || err)}</div>`; }
  document.getElementById('load').style.display = 'none';
  // mantém a lista e o passe do próprio horário em dia (sem atrapalhar o QR ou um formulário aberto)
  const quieto = () => !document.hidden && !QRT && document.getElementById('pm').style.display !== 'grid';
  setInterval(() => { if (quieto()) window.COORD_RELOAD(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (quieto()) window.COORD_RELOAD(); });
}

/* ==================== INSTALAR NA TELA INICIAL ==================== */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.ag) render(false); });
const jaInstalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const instalavel = () => !jaInstalado();
function instalarAgenda() {
  if (installEvt) { installEvt.prompt(); installEvt = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const el = document.getElementById('pm');
  el.innerHTML = `<div class="box"><h3>📲 Instalar a agenda</h3>
    ${ios ? '<p>No iPhone, abra este link no <b>Safari</b>, toque em <b>Compartilhar</b> (quadrado com seta ⬆) e depois em <b>Adicionar à Tela de Início</b>.</p>'
          : '<p>No Android, no <b>Chrome</b>: toque no menu <b>⋮</b> (canto superior) e depois em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>'}
    <p class="muted" style="font-size:13px">O ícone <b>bt</b> fica na tela do celular e abre direto na sua agenda, já atualizada.</p>
    <div class="acts"><button class="btn pri" onclick="closeP()">Entendi</button></div></div>`;
  el.style.display = 'grid';
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ==================== TEMA DO MÊS ==================== */
function temaDe(d) {
  const m = d.getMonth() + 1, dia = d.getDate();
  if (m === 4 && dia >= 12 && dia <= 20) return { cor: '#2b8a3e', ico: '🪶', txt: '19 de abril: Dia dos Povos Indígenas. Respeito às culturas originárias.', chuva: ['🪶', '🌿', '🏹'] };
  if (m === 6 && dia >= 24) return { cor: '#e64980', ico: '🏳️‍🌈', txt: '28 de junho: Dia do Orgulho LGBTQIA+. Respeito e diversidade na equipe.', chuva: ['🏳️‍🌈', '💖', '✨'] };
  if (m === 9 && dia <= 7) return { cor: '#2f9e44', ico: '🇧🇷', txt: '7 de setembro: Dia da Independência do Brasil.', chuva: ['🇧🇷', '💚', '💛'] };
  if (m === 1 && dia <= 10) return { cor: '#f5c542', ico: '🎆', txt: 'Feliz Ano Novo! Que venham grandes eventos.', chuva: ['✨', '🎉', '🥂'] };
  if (m === 1) return { cor: '#ffb703', ico: '☀️', txt: 'Janeiro de verão: hidrate-se nas montagens!', chuva: ['☀️', '🌊'] };
  if (m === 2) return { cor: '#c13cff', ico: '🎭', txt: 'Fevereiro de Carnaval: bom trabalho e boa folia!', chuva: ['🎉', '🎊', '🎭'] };
  if (m === 3) return { cor: '#e64980', ico: '🌷', txt: 'Março, mês da mulher: respeito e reconhecimento todos os dias.', chuva: ['🌷', '💐'] };
  if (m === 4) return { cor: '#b197fc', ico: '🐰', txt: 'Abril de Páscoa: renovação e boa energia na equipe.', chuva: ['🥚', '🐰', '🌼'] };
  if (m === 5) return { cor: '#f783ac', ico: '💐', txt: 'Maio, mês das mães e do trabalhador.', chuva: ['💐', '🌸'] };
  if (m === 6) return { cor: '#fd7e14', ico: '🎪', txt: 'Junho é Festa Junina: arraiá da base técnica!', chuva: ['🌽', '🔥', '🎏'] };
  if (m === 7) return { cor: '#4dabf7', ico: '❄️', txt: 'Julho de inverno: agasalhe-se nas madrugadas de montagem.', chuva: ['❄️', '☕'] };
  if (m === 8) return { cor: '#9775fa', ico: '💜', txt: 'Agosto Lilás: pelo fim da violência contra a mulher.', chuva: ['💜'] };
  if (m === 9) return { cor: '#fcc419', ico: '🎗️', txt: 'Setembro Amarelo: falar é a melhor solução. CVV 188.', chuva: ['💛', '🎗️'] };
  if (m === 10 && dia >= 25) return { cor: '#ff7b00', ico: '🎃', txt: 'Halloween chegando! Bom trabalho (sem sustos no palco).', chuva: ['🎃', '🦇', '🕸️'] };
  if (m === 10) return { cor: '#f06595', ico: '🎗️', txt: 'Outubro Rosa: prevenção do câncer de mama. Cuide-se!', chuva: ['🎗️', '💗'] };
  if (m === 11 && dia >= 13 && dia <= 21) return { cor: '#e9b949', ico: '✊🏾', txt: '20 de novembro: Dia da Consciência Negra.', chuva: ['✊🏾', '🌍'] };
  if (m === 11) return { cor: '#339af0', ico: '🎗️', txt: 'Novembro Azul: saúde do homem. Faça seus exames!', chuva: ['💙', '🎗️'] };
  if (m === 12 && dia >= 26) return { cor: '#f5c542', ico: '🎆', txt: 'Fim de ano! Obrigado pela temporada, equipe.', chuva: ['✨', '🎆', '🥂'] };
  return { cor: '#2f9e44', ico: '🎄', load: '🎅', txt: 'Feliz Natal, equipe base técnica!', chuva: ['❄️', '🎄', '⭐'] };
}
const icoMes = (y, m) => temaDe(new Date(y, m - 1, 5)).ico;
function faixaTema() { if (VIS.temaMes === false) return ''; const t = temaDe(new Date()); return `<div class="tema-faixa"><span class="ico">${t.ico}</span><span>${esc(t.txt)}</span></div>`; }
function aplicarTema() {
  const t = temaDe(new Date());
  document.documentElement.style.setProperty('--tema', VIS.temaMes === false ? (VIS.cor || '#c8161d') : t.cor);
  const bg = document.getElementById('temaBg'); if (!bg || bg.childElementCount) return;
  let h = '';
  for (let i = 0; i < 14; i++) h += `<span style="left:${(Math.random() * 100).toFixed(1)}%;font-size:${16 + Math.round(Math.random() * 22)}px;animation-duration:${14 + Math.round(Math.random() * 16)}s;animation-delay:-${Math.round(Math.random() * 25)}s">${t.chuva[i % t.chuva.length]}</span>`;
  bg.innerHTML = h;
}

/* ==================== CHAT DE ATENDIMENTO (técnico / freelancer) ==================== */
const CH = { aberto: false, msgs: [], ativo: false, ult: 0 };
const chKey = () => 'chat_visto_' + (TOKEN || EV);
function chatConv() {
  let c = lsGet('chat_c');
  if (!c) { c = Array.from(crypto.getRandomValues(new Uint8Array(14))).map(b => (b % 36).toString(36)).join(''); lsSet('chat_c', c); }
  return c;
}
const chatId = () => EV ? { e: EV, c: chatConv() } : { t: TOKEN };
async function chatCarregar() {
  try { const d = await apiGet(Object.assign({ f: 'chat' }, EV ? { e: EV, cv: chatConv() } : { t: TOKEN })); CH.ativo = d.ativo; CH.msgs = d.msgs || []; CH.ult = Date.now(); } catch (e) { /* offline */ }
  chatDesenhar(); chatEnviarFila();
}
function chatDesenhar() {
  const root = document.getElementById('chatRoot'); if (!root) return;
  if (!CH.ativo) { root.innerHTML = ''; return; }
  const visto = +(lsGet(chKey()) || 0);
  const n = CH.msgs.filter(m => m.de !== 'TÉCNICO' && m.ts > visto).length;
  if (!CH.aberto) { root.innerHTML = `<button class="chat-fab" onclick="chatAbrir()">💬 Atendimento${n ? ` <span class="n">${n}</span>` : ''}</button>`; return; }
  const txtAnt = (document.getElementById('chTxt') || {}).value || '', nomeAnt = (document.getElementById('chNome') || {}).value;
  const fila = JSON.parse(lsGet('chat_fila') || '[]');
  const pedeNome = EV && !(lsGet('ponto_nome') || '').trim();
  root.innerHTML = `<div class="chat-box on"><div class="chat-hd"><b style="flex:1">💬 Atendimento · coordenação</b><button class="btn" onclick="chatFechar()">✕</button></div>
    <div class="chat-msgs" id="chatMsgs">${CH.msgs.length || fila.length ? '' : '<div class="muted" style="font-size:13px">Fale direto com a coordenação: atraso, problema no check-in, localização, dúvidas. A resposta chega aqui.</div>'}
      ${CH.msgs.map(m => `<div class="bolha ${m.de === 'TÉCNICO' ? 'eu' : 'adm'}">${esc(m.texto)}<small>${m.de === 'TÉCNICO' ? 'Você' : 'Coordenação'} · ${esc(m.quando)}</small></div>`).join('')}
      ${fila.map(f => `<div class="bolha eu" style="opacity:.6">${esc(f.texto)}<small>⏳ aguardando internet para enviar…</small></div>`).join('')}</div>
    <div class="chat-ft">${pedeNome ? '<input id="chNome" placeholder="Seu nome completo" autocomplete="name">' : ''}
      <div class="atalhos">${['Vou me atrasar', 'Não consigo fazer o check-in', 'A localização não funciona', 'Estou sem internet no local', 'Tenho uma dúvida'].map(a => `<button class="btn" onclick="chatAtalho(this.textContent)">${a}</button>`).join('')}</div>
      <div style="display:flex;gap:8px"><textarea id="chTxt" rows="2" placeholder="Escreva sua mensagem…"></textarea><button class="btn pri" onclick="chatMandar()">Enviar</button></div></div></div>`;
  document.getElementById('chTxt').value = txtAnt;
  if (nomeAnt != null && document.getElementById('chNome')) document.getElementById('chNome').value = nomeAnt;
  const box = document.getElementById('chatMsgs'); box.scrollTop = box.scrollHeight;
  lsSet(chKey(), String(Date.now()));
}
function chatAtalho(t) { const x = document.getElementById('chTxt'); x.value = (x.value ? x.value + ' ' : '') + t + ': '; x.focus(); }
function chatAbrir() { CH.aberto = true; chatDesenhar(); chatCarregar(); }
function chatFechar() { CH.aberto = false; chatDesenhar(); }
async function chatMandar() {
  const nEl = document.getElementById('chNome');
  if (nEl) { const n = nEl.value.trim(); if (n.length < 3) return alert('Digite seu nome completo.'); lsSet('ponto_nome', n); }
  const t = document.getElementById('chTxt').value.trim(); if (!t) return;
  const fila = JSON.parse(lsGet('chat_fila') || '[]'); fila.push({ texto: t }); lsSet('chat_fila', JSON.stringify(fila));
  document.getElementById('chTxt').value = '';
  chatDesenhar(); await chatEnviarFila();
}
let chatEnviando = false;
async function chatEnviarFila() {
  if (chatEnviando) return;
  const fila = JSON.parse(lsGet('chat_fila') || '[]'); if (!fila.length) return;
  chatEnviando = true;
  try {
    while (fila.length) {
      const body = Object.assign({ acao: 'chat_enviar', texto: fila[0].texto, nome: lsGet('ponto_nome') || '' }, chatId());
      let d;
      try { d = await apiPost(body); }
      catch (e) { if (/fetch|network|Failed|Load failed/i.test(e.message || '')) throw e; alert('⚠ ' + (e.message || e)); d = null; }
      if (d && d.msgs) CH.msgs = d.msgs;
      fila.shift(); lsSet('chat_fila', JSON.stringify(fila));
    }
  } catch (e) { /* sem internet: fica na fila e tenta de novo */ }
  chatEnviando = false; chatDesenhar();
}
window.addEventListener('online', () => { chatEnviarFila(); chatCarregar(); });
function iniciarChat() {
  chatCarregar();
  setInterval(() => { if (!document.hidden && (CH.aberto || Date.now() - CH.ult > 60000)) chatCarregar(); }, 10000);
}

setTimeout(atualizarVisual, 1200);
if (CADR) {
  aplicarTema();
  initCadastro();
} else if (SEMPARAM) {
  aplicarTema();
  initLogin();
} else if (ADM) {
  initAdm(); barraSessao();
} else if (COORD) {
  aplicarTema();
  initCoord();
} else if (COORDG) {
  aplicarTema();
  initCoordG(); barraSessao();
} else if (EV) {
  aplicarTema();
  initEvento();
  iniciarChat();
  alertaIniciar();
} else {
  aplicarTema();
  iniciarChat();
  barraSessao();
  refresh(true);
  loadPonto();
  loadCache();
  alertaIniciar();
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  // responsável pelo link da agenda: atualiza o ponto a cada minuto para os avisos (12 h, horários para confirmar)
  setInterval(() => { if (!document.hidden && S.ponto && S.ponto.coordena && S.ponto.coordena.length && document.getElementById('pm').style.display !== 'grid') loadPonto(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); loadPonto(); } });
}
