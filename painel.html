<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala Técnica</title>
<link rel="manifest" href="manifest-controle.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controle bt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* identidade: preto e vermelho; verde só para "ok / ao vivo" */
  --bg:#0b0b0c; --panel:#151517; --panel2:#1d1d20; --line:#2a2a2f; --line2:#3a3a41;
  --text:#f2f2f3; --muted:#9a9aa3; --dim:#66666e;
  --accent:#c8161d; --accent2:#9e0f1c; --accentSoft:rgba(200,22,29,.16);
  --ok:#1fbf75; --okSoft:rgba(31,191,117,.14);
  --red:#ff5b5f; --redSoft:rgba(255,91,95,.15); --amber:#f5b83d; --amberSoft:rgba(245,184,61,.15);
  --blue:#4c9dff; --blueSoft:rgba(76,157,255,.15); --violet:#a97cff;
  --ph-mont:#f5b83d; --ph-ens:#a97cff; --ph-op:#1fbf75; --ph-desm:#4c9dff; --ph-full:#19c2c2; --ph-sem:#3b4656;
  --r:12px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* sidebar */
.side{background:#0a0e13;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:#9e0f1c;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}.logo img~span{display:none}
.brand b{display:block;font-size:15px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--muted);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto}
.side .foot{margin-top:auto;color:var(--dim);font-size:11px;padding:8px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(13,17,23,.9);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700;white-space:nowrap}
.top>div:first-child{min-width:0;flex:0 1 auto}
.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top{flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:12px}
.top .grow{flex:1}
.content{padding:22px 24px 40px;overflow:auto;flex:1}
select.ctl,input.ctl{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;min-width:0}
select.ctl:focus,input.ctl:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#ff3a3f}
.btn.danger{color:var(--red);border-color:rgba(255,91,95,.4)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;background:var(--line);color:var(--text)}
.badge.red{background:var(--red);color:#fff}.badge.amber{background:var(--amber);color:#211500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-brev{background:var(--blueSoft);color:var(--blue)}
.st-exec{background:var(--okSoft);color:var(--ok)}
.st-fin{background:rgba(139,152,169,.15);color:var(--muted)}
.st-warn{background:var(--amberSoft);color:var(--amber)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .muted{font-weight:500}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:30px;font-weight:800;margin-top:6px;font-family:"JetBrains Mono",monospace}
.kpi .h{font-size:12px;color:var(--dim)}
.kpi.red .v{color:var(--red)}.kpi.amber .v{color:var(--amber)}.kpi.green .v{color:var(--ok)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--line2)}
.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
/* timeline */
.tl{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tl table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
.tl th,.tl td{padding:0;height:34px;border-bottom:1px solid var(--line);text-align:center;font-size:11px}
.tl th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel2);z-index:2;height:30px}
.tl th.today{color:var(--accent)}
.tl .ev{position:sticky;left:0;background:var(--panel);text-align:left;padding:0 12px;min-width:230px;max-width:230px;z-index:1;border-right:1px solid var(--line);cursor:pointer}
.tl th.ev{z-index:3;background:var(--panel2)}
.tl .ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ev span{font-size:10px;color:var(--dim)}
.tl tr:hover td{background:rgba(255,255,255,.02)}
.tl td.d{min-width:26px}
.tl td.d.today{background:rgba(227,38,43,.07)}
.bar{margin:6px 1px;height:20px;border-radius:4px;font-size:9px;font-weight:800;color:#0b0f14;display:flex;align-items:center;justify-content:center;position:relative}
.bar.cf:after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
.ph-MONT{background:var(--ph-mont)}.ph-ENS{background:var(--ph-ens)}.ph-OP{background:var(--ph-op)}.ph-DESM{background:var(--ph-desm)}.ph-FULL{background:var(--ph-full)}.ph-SEM{background:var(--ph-sem);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.row .grow{flex:1;min-width:0}
.row b{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;background:var(--line);font-size:12px;font-weight:600}
.chip.red{background:var(--redSoft);color:var(--red)}
.chip.amber{background:var(--amberSoft);color:var(--amber)}
.chip.green{background:var(--okSoft);color:var(--ok)}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0;font-weight:800;opacity:.7}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
/* table events */
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--panel2)}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .ctl{min-width:240px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.seg button.on{background:var(--panel2);color:var(--text)}
/* team matrix */
.mx td.c{min-width:30px;padding:2px}
.mx .cell{height:26px;border-radius:5px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#0b0f14;cursor:default;overflow:hidden}
.mx .cell.cf{background:var(--red)!important;color:#fff;box-shadow:0 0 0 2px rgba(255,91,95,.35)}
.mx .tot{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:11px}
/* form */
.form{display:grid;gap:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field .ctl{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.day{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:12px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.day small{font-size:8px;font-weight:700;margin-top:3px;color:var(--dim)}
.day.act{border-color:var(--line2)}
.day.act small{color:var(--accent)}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.day.on small{color:#fff}
.day.busy:after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.avail .row{cursor:pointer;padding:9px 12px}
.avail .row:hover{border-color:var(--accent)}
.avail .row.sel{border-color:var(--accent);background:var(--accentSoft)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.phgrid .ph{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.phgrid .ph b{font-family:"JetBrains Mono",monospace;width:24px}
.phgrid select{flex:1;background:transparent;border:0;outline:none;font-size:12px}
.phgrid option,select option{background:var(--panel)}
/* drawer */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
.ovl.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(920px,96vw);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer .hd{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer .bd{padding:20px 24px;overflow:auto}
.drawer h2{margin:4px 0 6px;font-size:21px}
.meta{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:13px}
.meta b{color:var(--text);font-weight:600}
.eg{overflow:auto;border:1px solid var(--line);border-radius:10px}
.eg table{border-collapse:collapse;width:100%}
.eg th,.eg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;font-size:12px;vertical-align:top;min-width:120px}
.eg th{background:var(--panel2);color:var(--muted);text-align:left;font-weight:600;position:sticky;top:0}
.eg td.role,.eg th.role{min-width:110px;font-weight:700;background:var(--panel);position:sticky;left:0;color:var(--text)}
.eg td.slot{cursor:pointer}
.eg td.slot:hover{background:var(--panel2)}
.eg td.slot.falta{background:var(--amberSoft)}
.eg td.slot .n{display:block;font-weight:600}
.eg td.slot .n.cf{color:var(--red)}
.eg td.slot .plus{color:var(--dim);font-size:11px}
.eg td.slot.inat{background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,.025) 6px,rgba(255,255,255,.025) 12px);cursor:default}
.mini{border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:6px;font-size:11px;padding:1px 6px;cursor:pointer;margin-left:4px}
.mini:hover{color:var(--text);border-color:var(--accent)}
/* modal & toast */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:rgba(0,0,0,.55)}
.modal.on{display:grid}
.modal .box{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:40}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--ok);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:380px;animation:in .2s}
.toast.err{border-left-color:var(--red)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(13,17,23,.6);z-index:50}
.spin{width:34px;height:34px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
/* ao vivo */
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(31,191,117,.6);animation:pulse 2s infinite}
.live.err i{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(31,191,117,0)}100%{box-shadow:0 0 0 0 rgba(31,191,117,0)}}
/* operação editável */
select.opsel{width:100%;margin-top:6px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-size:11px;font-weight:700;color:var(--text);outline:none}
select.opsel.none{border-color:var(--amber);color:var(--amber)}
.ef{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px;padding:14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel)}
.ef .field label{font-size:10px}
/* calendário do técnico */
.calhd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhd h3{margin:0;font-size:18px;min-width:180px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:4px 0}
.cal .cd{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--panel2);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .cd.out{opacity:.25}
.cal .cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .cd .n{font-size:12px;font-weight:700;color:var(--muted)}
.cal .cd.work .n{color:var(--text)}
.cal .ce{font-size:10px;font-weight:700;border-radius:5px;padding:3px 5px;color:#0b0f14;line-height:1.25;overflow:hidden}
.cal .ce small{display:block;font-weight:600;opacity:.8}
.share{display:grid;gap:10px}
.share .lk{display:flex;gap:8px}
.share .lk input{flex:1}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 0}
.stat div{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:20px;color:var(--text);font-family:"JetBrains Mono",monospace}
@media (max-width:820px){.cal .cd{min-height:64px}.cal .ce small{display:none}.ef{grid-template-columns:1fr}}
.sec{margin-top:22px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.side .foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 10px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .top{flex-wrap:wrap;padding:12px 16px}.content{padding:16px}
  .f2,.f3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><img src="https://giovaniaudiovisualdrive-ctrl.github.io/escala/logo.png" alt="" onerror="this.remove()"><span style="font-family:Arial,sans-serif;font-size:19px;letter-spacing:-1px">bt</span></div><div><b>Escala Técnica</b><small>base técnica · vídeo</small></div></div>
    <button class="nav on" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Visão geral</button>
    <button class="nav" data-view="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Eventos</button>
    <button class="nav" data-view="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3.2 4 1.8 4.5 4.5"/></svg>Agenda da equipe</button>
    <button class="nav" data-view="person"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="12" cy="15" r="2.5"/></svg>Agenda individual</button>
    <button class="nav" data-view="issues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>Pendências<span class="badge" id="nbIssues">0</span></button>
    <button class="nav" data-view="ponto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Ponto</button>
    <button class="nav" data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/></svg>Atendimento<span class="badge" id="nbChat" style="display:none">0</span></button>
    <button class="nav" data-view="assign"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="8" r="4"/><path d="M3 21c1-4 3.7-6 7-6 1.3 0 2.5.3 3.5.9M19 15v6M16 18h6"/></svg>Escalar técnico</button>
    <button class="nav" data-view="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Novo evento</button>
    <div class="foot" id="footInfo">—</div>
  </aside>

  <main class="main">
    <header class="top">
      <div><h1 id="title">Visão geral</h1><div class="sub" id="subtitle">Carregando…</div></div>
      <div class="grow"></div>
      <span class="live" id="live" title="O painel confere a planilha a cada 15 segundos"><i></i><span id="liveTxt">Ao vivo</span></span>
      <select class="ctl" id="sheetSel" title="Aba da planilha"></select>
      <button class="btn" id="btnStatus" title="Ajusta EM BREVE / EM EXECUÇÃO / EVENTO FINALIZADO pelas datas">⟳ Status automático</button>
      <button class="btn" id="btnMark" title="Pinta as células em conflito na planilha">⚑ Marcar conflitos</button>
      <button class="btn" id="btnFull" title="Abrir o painel numa aba inteira do navegador">⛶ Tela cheia</button>
      <button class="btn pri" id="btnReload">↻ Atualizar</button>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div class="ovl" id="ovl"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>
<div class="loading hide" id="loading"><div class="spin"></div></div>

<script>
/* ---------------- API (Apps Script ou modo demonstração) ---------------- */
const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// Dentro da planilha (Apps Script) a chave vem do servidor; no Controle (GitHub) vem do link secreto ?k=
const IS_CONTROLE = !HAS_GAS && !window.MOCK_API;
const ADMIN_KEY = HAS_GAS ? '<?= key ?>' : (new URLSearchParams(location.search).get('k') || '');
const PANEL_MODE = HAS_GAS ? '<?= mode ?>' : (IS_CONTROLE ? 'controle' : 'mock');
const API_URL = 'https://script.google.com/macros/s/AKfycbzC4SQUnbGNWFK7xlj0xUKbmoMuGYWDN-8AExukFuHmepDC1JiEgVLS3FiH1KIrv9to/exec';
function api(fn, ...args) {
  return new Promise((res, rej) => {
    if (HAS_GAS) return google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](ADMIN_KEY, ...args);
    if (window.MOCK_API) return window.MOCK_API[fn](ADMIN_KEY, ...args).then(res, rej);
    fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao: 'painel', k: ADMIN_KEY, fn, args }) })
      .then(r => r.json()).then(d => d && d.erro ? rej(new Error(d.erro)) : res(d ? d.r : d))
      .catch(e => rej(new Error('Sem conexão com o servidor. Verifique a internet.')));
  });
}

/* ---------------- Estado ---------------- */
const S = { data: null, view: 'overview', sheet: null, teamFilter: '', teamMode: 'busy', evFilter: '', evStatus: 'all',
  assign: { row: null, role: null, days: [], name: '' }, create: null, drawer: null, drawerEdit: false,
  person: { name: '', ag: null, month: null, mode: 'cal' } };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WD = ['D','S','T','Q','Q','S','S'];
const PALETTE = ['#1fbf75','#4c9dff','#f5b83d','#a97cff','#19c2c2','#ff8a5c','#e86bb4','#9bd34a','#5ad1ff','#ffd166','#c49bff','#4fd1a5'];
const evColor = id => PALETTE[id % PALETTE.length];

function phaseClass(p) {
  const k = norm(p);
  if (!k || k === '.') return '';
  if (k.includes('SEM')) return 'SEM';
  if (k.includes('MONT/OP') || k.includes('MONT / OP')) return 'FULL';
  if (k.includes('DESM')) return 'DESM';
  if (k.includes('ENSAIO') && !k.includes('MONT')) return 'ENS';
  if (k.includes('MONT')) return 'MONT';
  return 'OP';
}
const PH_ABBR = { MONT: 'M', ENS: 'E', OP: 'OP', DESM: 'D', FULL: 'M·O·D', SEM: '—' };
function statusPill(s) {
  const k = norm(s);
  const cls = k.includes('BREVE') ? 'st-brev' : k.includes('EXEC') ? 'st-exec' : k.includes('FINAL') ? 'st-fin' : 'st-warn';
  return `<span class="pill ${cls}">${esc(s || 'SEM STATUS')}</span>`;
}
function weekday(day) { const d = new Date(S.data.year, S.data.month, day); return WD[d.getDay()]; }
function isWeekend(day) { const g = new Date(S.data.year, S.data.month, day).getDay(); return g === 0 || g === 6; }

/* ---------------- UI helpers ---------------- */
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.innerHTML = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 4000);
}
function loading(on) { $('#loading').classList.toggle('hide', !on); }
function modal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
function openDrawer(html) { $('#drawer').innerHTML = html; $('#drawer').classList.add('on'); $('#ovl').classList.add('on'); }
function closeDrawer() { $('#drawer').classList.remove('on'); $('#ovl').classList.remove('on'); S.drawer = null; S.drawerEdit = false; }
$('#ovl').onclick = closeDrawer;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
async function run(fn, args) {
  loading(true); S.busy = true;
  try { const r = await api(fn, ...args); return r; }
  catch (e) { toast('⚠ ' + esc(e && e.message || e), true); throw e; }
  finally { loading(false); S.busy = false; }
}

/* ---------------- Carregar ---------------- */
async function load(sheet, silent) {
  if (!silent) loading(true);
  try {
    const keepScroll = $('#content').scrollTop, dScroll = $('#drawer .bd') ? $('#drawer .bd').scrollTop : 0;
    S.data = await api('getData', sheet || S.sheet || (PANEL_MODE === 'web' || PANEL_MODE === 'controle' ? '__ATUAL__' : null));
    S.sheet = S.data.sheet;
    S.lastCheck = Date.now(); S.liveErr = false; paintLive();
    if (S.person.ag) S.person.stale = true;
    const sel = $('#sheetSel');
    sel.innerHTML = S.data.sheets.map(n => `<option ${n === S.sheet ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const issues = S.data.conflicts.length + S.data.gaps.length + divergent().length + realEvents().reduce((n, e) => n + (e.noPhaseDays || []).length, 0);
    const nb = $('#nbIssues'); nb.textContent = issues; nb.className = 'badge' + (S.data.conflicts.length ? ' red' : issues ? ' amber' : '');
    $('#footInfo').textContent = 'Sincronizado às ' + new Date(S.data.updatedAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    render();
    if (silent) $('#content').scrollTop = keepScroll;
    if (S.drawer != null && $('#drawer').classList.contains('on')) {
      const ev = S.data.events.find(e => e.row === S.drawer);
      if (ev) { showEvent(ev.id, true); if ($('#drawer .bd')) $('#drawer .bd').scrollTop = dScroll; } else closeDrawer();
    }
  } catch (e) { toast('⚠ Não consegui ler a planilha: ' + esc(e && e.message || e), true); }
  finally { loading(false); }
}

/* ---------------- Sincronização ao vivo ---------------- */
function paintLive() {
  const el = $('#live'); if (!el) return;
  el.classList.toggle('err', !!S.liveErr);
  const s = S.lastCheck ? Math.round((Date.now() - S.lastCheck) / 1000) : null;
  $('#liveTxt').textContent = S.liveErr ? 'Sem conexão' : s == null ? 'Ao vivo' : s < 5 ? 'Ao vivo · agora' : `Ao vivo · há ${s}s`;
}
setInterval(paintLive, 1000);
function userIsTyping() {
  const a = document.activeElement;
  return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'sheetSel';
}
async function liveTick() {
  if (document.hidden || !S.data || S.busy || userIsTyping() || $('#modal').classList.contains('on')) return;
  try {
    const v = await api('getVersion', S.sheet);
    S.lastCheck = Date.now(); S.liveErr = false;
    if (v !== S.data.version) {
      await load(null, true);
      if (S.view === 'person' && S.person.name) loadPerson(S.person.name, true);
      toast('↻ A planilha foi alterada: painel atualizado.');
    }
  } catch (e) { S.liveErr = true; }
  paintLive();
}
setInterval(liveTick, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) liveTick(); });
const realEvents = () => S.data.events.filter(e => !e.isTemplate);
const divergent = () => realEvents().filter(e => e.computedStatus && norm(e.status) !== norm(e.computedStatus));

/* ---------------- Navegação ---------------- */
const TITLES = { overview: 'Visão geral', events: 'Eventos', team: 'Agenda da equipe', person: 'Agenda individual', ponto: 'Ponto (check-in / check-out)', chat: 'Atendimento', issues: 'Pendências', assign: 'Escalar técnico', create: 'Novo evento' };
document.querySelectorAll('.nav').forEach(b => b.onclick = () => go(b.dataset.view));
function go(view) {
  S.view = view;
  document.querySelectorAll('.nav').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  closeDrawer(); render(); $('#content').scrollTop = 0;
  if (view === 'person' && S.person.name && (!S.person.ag || S.person.stale)) loadPerson(S.person.name);
}
function render() {
  if (!S.data) return;
  $('#title').textContent = TITLES[S.view];
  $('#subtitle').textContent = `${MESES[S.data.month]} ${S.data.year} · ${realEvents().length} eventos · aba "${S.sheet}"`;
  ({ overview: vOverview, events: vEvents, team: vTeam, person: vPerson, ponto: vPonto, chat: vChat, issues: vIssues, assign: vAssign, create: vCreate })[S.view]();
}

/* ---------------- Visão geral ---------------- */
function vOverview() {
  const D = S.data, evs = realEvents(), t = D.today;
  const active = t ? evs.filter(e => e.activeDays.includes(t)) : [];
  const busyToday = t ? D.team.filter(m => m.days[t]).length : 0;
  const scheduled = D.team.filter(m => m.total > 0).length;
  $('#content').innerHTML = `
  <div class="grid kpis">
    <div class="kpi click" onclick="go('events')"><div class="l">Eventos no mês</div><div class="v">${evs.length}</div><div class="h">${evs.filter(e => norm(e.computedStatus || e.status).includes('BREVE')).length} em breve</div></div>
    <div class="kpi green"><div class="l">Acontecendo hoje</div><div class="v">${active.length}</div><div class="h">${t ? 'dia ' + t : 'fora deste mês'}</div></div>
    <div class="kpi click" onclick="go('team')"><div class="l">Técnicos escalados</div><div class="v">${scheduled}</div><div class="h">${busyToday} trabalhando hoje</div></div>
    <div class="kpi click ${D.conflicts.length ? 'red' : ''}" onclick="go('issues')"><div class="l">Conflitos</div><div class="v">${D.conflicts.length}</div><div class="h">mesma pessoa, 2 eventos</div></div>
    <div class="kpi click ${D.gaps.length ? 'amber' : ''}" onclick="go('issues')"><div class="l">Vagas em aberto</div><div class="v">${D.gaps.length}</div><div class="h">células “FALTA”</div></div>
  </div>
  <div class="grid two sec">
    <div class="card"><h3>Hoje ${t ? `<span class="muted">· ${t}/${String(D.month + 1).padStart(2, '0')}</span>` : ''}</h3>
      ${active.length ? `<div class="list">${active.map(e => `
        <div class="row" style="cursor:pointer" onclick="showEvent(${e.id})">
          <span class="dot" style="background:${evColor(e.id)}"></span>
          <div class="grow"><b>${esc(e.nome)}</b> <span class="dim mono">${esc(e.os)}</span><div class="muted" style="font-size:12px">${esc(e.local)} · ${phaseClass(e.phases[t - 1]) ? esc(e.phases[t - 1]) : '<span style="color:var(--amber)">operação não definida</span>'}</div></div>
          <div class="chips">${dayPeople(e, t).map(p => `<span class="chip">${esc(p)}</span>`).join('') || '<span class="chip amber">sem equipe</span>'}</div>
        </div>`).join('')}</div>` : `<div class="empty">${t ? 'Nenhum evento ativo hoje.' : 'O mês desta aba não é o mês atual.'}</div>`}
    </div>
    <div class="card"><h3>Próximos dias</h3>${upcoming()}</div>
  </div>
  <div class="card sec"><h3>Linha do tempo <span class="muted">· clique no evento para ver a escala</span></h3>${timeline(evs)}
    <div class="legend"><span><i class="ph-MONT"></i>Montagem</span><span><i class="ph-ENS"></i>Ensaio/Teste</span><span><i class="ph-OP"></i>Operação</span><span><i class="ph-DESM"></i>Op/Desmontagem</span><span><i class="ph-FULL"></i>Mont/Op/Desmont</span><span><i class="ph-SEM"></i>Sem operação</span><span><i style="background:var(--red);border-radius:50%"></i>Conflito no dia</span></div>
  </div>`;
}
function dayPeople(e, day) {
  const out = [];
  e.roles.forEach(r => String(r.cells[day - 1] || '').split('/').forEach(x => { x = x.trim(); if (x && x !== '.' && !isInat(x) && !out.includes(x)) out.push(x); }));
  return out;
}
function upcoming() {
  const D = S.data; if (!D.today) return '<div class="empty">Sem referência de hoje nesta aba.</div>';
  const rows = [];
  for (let d = D.today + 1; d <= Math.min(D.days, D.today + 7); d++) {
    const evs = realEvents().filter(e => e.activeDays.includes(d));
    if (evs.length) rows.push(`<div class="row"><div style="width:44px;text-align:center"><div class="mono" style="font-size:17px;font-weight:700">${d}</div><div class="dim" style="font-size:10px">${weekday(d)}</div></div>
      <div class="grow chips">${evs.map(e => `<span class="chip" style="cursor:pointer;border-left:3px solid ${evColor(e.id)}" onclick="showEvent(${e.id})">${esc(e.nome)}${phaseClass(e.phases[d - 1]) ? ' · ' + esc(PH_ABBR[phaseClass(e.phases[d - 1])]) : ' · <span style="color:var(--amber)">operação ?</span>'}</span>`).join('')}</div></div>`);
  }
  return rows.length ? `<div class="list">${rows.join('')}</div>` : '<div class="empty">Nada agendado nos próximos 7 dias.</div>';
}
function conflictDaysOf(evId) {
  const s = new Set(); S.data.conflicts.forEach(c => c.items.forEach(a => { if (a.ev === evId) s.add(c.day); })); return s;
}
function timeline(evs) {
  const D = S.data; let h = '<div class="tl"><table><thead><tr><th class="ev">Evento</th>';
  for (let d = 1; d <= D.days; d++) h += `<th class="${d === D.today ? 'today' : ''}" style="${isWeekend(d) ? 'color:var(--dim)' : ''}">${d}<br><span style="font-size:9px">${weekday(d)}</span></th>`;
  h += '</tr></thead><tbody>';
  evs.forEach(e => {
    const cf = conflictDaysOf(e.id);
    h += `<tr><td class="ev" onclick="showEvent(${e.id})"><b><span class="dot" style="display:inline-block;background:${evColor(e.id)};margin-right:7px;width:8px;height:8px"></span>${esc(e.nome)}</b><span>${esc(e.os)} · ${esc(e.local)}</span></td>`;
    for (let d = 1; d <= D.days; d++) {
      const pc = phaseClass(e.phases[d - 1]);
      const np = !pc && e.noPhaseDays && e.noPhaseDays.includes(d);
      h += `<td class="d ${d === D.today ? 'today' : ''}">${np ? `<div class="bar" style="border:1px dashed var(--amber);color:var(--amber)" title="Equipe escalada sem operação definida">?</div>` : ''}${pc ?`<div class="bar ph-${pc} ${cf.has(d) ? 'cf' : ''}" title="${esc(e.nome)} · dia ${d}: ${esc(e.phases[d - 1])}">${PH_ABBR[pc] === 'M·O·D' ? '●' : PH_ABBR[pc]}</div>` : ''}</td>`;
    }
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

/* ---------------- Eventos ---------------- */
function vEvents() {
  const f = norm(S.evFilter);
  let evs = realEvents().filter(e => !f || norm([e.nome, e.os, e.local, e.people.join(' ')].join(' ')).includes(f));
  if (S.evStatus !== 'all') evs = evs.filter(e => norm(e.computedStatus || e.status).includes(S.evStatus));
  $('#content').innerHTML = `
  <div class="toolbar">
    <input class="ctl" id="evQ" placeholder="Buscar evento, OS, local ou técnico…" value="${esc(S.evFilter)}">
    <div class="seg">${[['all', 'Todos'], ['BREVE', 'Em breve'], ['EXEC', 'Em execução'], ['FINAL', 'Finalizados']].map(([k, l]) => `<button class="${S.evStatus === k ? 'on' : ''}" onclick="S.evStatus='${k}';render()">${l}</button>`).join('')}</div>
    <div class="grow"></div><button class="btn pri" onclick="go('create')">＋ Novo evento</button>
  </div>
  <div class="card" style="padding:0;overflow:auto"><table class="tbl"><thead><tr><th>Status</th><th>Evento</th><th>OS</th><th>Local</th><th>Período</th><th>Lista</th><th>Equipe</th><th>Alertas</th></tr></thead><tbody>
  ${evs.map(e => `<tr class="click" onclick="showEvent(${e.id})">
    <td>${statusPill(e.computedStatus || e.status)}${e.computedStatus && norm(e.computedStatus) !== norm(e.status) ? `<div class="dim" style="font-size:10px;margin-top:3px">planilha: ${esc(e.status || '—')}</div>` : ''}</td>
    <td><b><span class="dot" style="display:inline-block;background:${evColor(e.id)};margin-right:7px;width:8px;height:8px"></span>${esc(e.nome)}</b></td>
    <td class="mono">${esc(e.os) || '<span class="dim">—</span>'}</td><td class="muted">${esc(e.local)}</td>
    <td class="mono">${esc(e.start)}${e.end && e.end !== e.start ? ' → ' + esc(e.end) : ''}</td>
    <td>${norm(e.lista).includes('FAZER') ? `<span class="chip amber">${esc(e.lista)}</span>` : `<span class="muted" style="font-size:12px">${esc(e.lista)}</span>`}</td>
    <td>${e.people.length ? `<span class="chip">${e.people.length} pessoa${e.people.length > 1 ? 's' : ''}</span>` : '<span class="chip amber">vazia</span>'}</td>
    <td class="chips">${e.conflitos ? `<span class="chip red">${e.conflitos} conflito${e.conflitos > 1 ? 's' : ''}</span>` : ''}${e.faltas ? `<span class="chip amber">${e.faltas} falta${e.faltas > 1 ? 's' : ''}</span>` : ''}${!e.conflitos && !e.faltas ? '<span class="chip green">ok</span>' : ''}</td>
  </tr>`).join('') || `<tr><td colspan="8"><div class="empty">Nenhum evento encontrado.</div></td></tr>`}
  </tbody></table></div>`;
  const q = $('#evQ'); q.oninput = () => { S.evFilter = q.value; const p = q.selectionStart; render(); const n = $('#evQ'); n.focus(); n.setSelectionRange(p, p); };
}

function opSelect(e, d) {
  const cur = e.phases[d - 1]; const has = phaseClass(cur);
  const opts = S.data.options.phases.slice(); if (has && !opts.includes(cur)) opts.unshift(cur);
  return `<select class="opsel ${has ? '' : 'none'}" data-row="${e.row}" data-d="${d}" onchange="setOp(this)">
    ${has ? '' : '<option value="" selected>⚠ definir operação…</option>'}
    ${opts.map(p => `<option ${p === cur ? 'selected' : ''}>${esc(p)}</option>`).join('')}
    <option value="">✕ tirar este dia</option></select>`;
}
async function setOp(sel) {
  const row = +sel.dataset.row, d = +sel.dataset.d, phase = sel.value;
  sel.blur();
  await run('definirOperacao', [{ sheet: S.sheet, row, map: { [d]: phase } }]);
  toast(phase ? `✅ Dia ${d}: ${esc(phase)}` : `Dia ${d} retirado do evento.`); load(null, true);
}
async function addDay(row) {
  const d = +$('#addDay').value, ph = $('#addOp').value;
  if (!d) return toast('Escolha o dia.', true);
  await run('definirOperacao', [{ sheet: S.sheet, row, map: { [d]: ph } }]);
  toast(`✅ Dia ${d} adicionado como ${esc(ph)}.`); load(null, true);
}
async function saveEvent(row) {
  const v = id => $('#' + id).value;
  await run('editarEvento', [{ sheet: S.sheet, row, nome: v('eNome'), os: v('eOs'), local: v('eLocal'), lista: v('eLista'), status: v('eStatus'), start: v('eStart'), end: v('eEnd') }]);
  S.drawerEdit = false; toast('✅ Dados do evento salvos na planilha.'); load(null, true);
}
function showEvent(id, keep) {
  const e = S.data.events[id]; const D = S.data;
  if (!keep && S.drawer !== e.row) S.drawerEdit = false;
  S.drawer = e.row;
  const days = e.activeDays.length ? e.activeDays : [];
  const free = []; for (let d = 1; d <= D.days; d++) if (!days.includes(d)) free.push(d);
  const cfMap = {}; D.conflicts.forEach(c => c.items.forEach(a => { if (a.ev === id) cfMap[a.row + ':' + a.day] = (cfMap[a.row + ':' + a.day] || []).concat(c.key); }));
  const O = D.options;
  openDrawer(`
  <div class="hd"><div style="flex:1"><div class="chips">${statusPill(e.computedStatus || e.status)}${norm(e.lista).includes('FAZER') ? `<span class="chip amber">${esc(e.lista)}</span>` : `<span class="chip">${esc(e.lista)}</span>`}</div>
    <h2>${esc(e.nome)}</h2>
    <div class="meta"><span>OS <b class="mono">${esc(e.os) || '—'}</b></span><span>Local <b>${esc(e.local) || '—'}</b></span><span>Período <b>${esc(e.start)}${e.end !== e.start ? ' → ' + esc(e.end) : ''}</b></span><span>Equipe <b>${e.people.length}</b></span></div></div>
    <button class="btn ghost" onclick="closeDrawer()">✕</button></div>
  <div class="bd">
    <div class="toolbar"><button class="btn pri" onclick="startAssign(${e.row})">＋ Escalar técnico</button>
    <button class="btn" onclick="S.drawerEdit=!S.drawerEdit;showEvent(${id},true)">✎ ${S.drawerEdit ? 'Fechar edição' : 'Editar dados'}</button>
    <button class="btn" onclick="confirmarEscalacao(${e.row})" title="Marca as vagas em branco como inativas">✓ Confirmar escalação${e.vazios ? ` <span class="badge amber">${e.vazios}</span>` : ''}</button>
    <button class="btn" onclick="linkCheckin(${e.row})">⏱ Link de check-in</button>
    <button class="btn" onclick="goSheet(${e.row},1)">↗ Ver na planilha</button></div>
    ${S.drawerEdit ? `<div class="ef">
      <div class="field"><label>Nome</label><input class="ctl" id="eNome" value="${esc(e.nome)}"></div>

function abbr(n) { const w = norm(n).replace(/[^A-Z0-9 ]/g, '').split(' ').filter(Boolean); return w.length > 1 ? (w[0][0] + w[1][0]) : (w[0] || '?').slice(0, 3); }

const MES_ABR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function hcolor(s) { let h = 0; for (const c of norm(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function isoParts(iso) { const [y, m, d] = iso.split('-').map(Number); return { y, m: m - 1, d }; }
function fmtIso(iso) { const p = isoParts(iso); return `${String(p.d).padStart(2, '0')}/${String(p.m + 1).padStart(2, '0')}`; }
function todayIso() { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; }
function openPerson(name) { S.person.name = name; S.person.ag = null; S.person.month = null; go('person'); }
async function loadPerson(name, silent) {
  if (!silent) loading(true);
  try {
    const ag = await api('getAgenda', name);
    S.person.ag = ag; S.person.name = ag.nome; S.person.stale = false;

  } catch (e) { toast('⚠ ' + esc(e && e.message || e), true); }
  finally { if (!silent) loading(false); }
}
function runsText(runs, nome, link) {
  const lines = [`*Agenda ${nome}*`];
  let cur = '';
  runs.forEach(r => {
    const p = isoParts(r.from), mk = MESES[p.m] + ' ' + p.y;
    if (mk !== cur) { cur = mk; lines.push('', `*${mk}*`); }
    const per = r.from === r.to ? fmtIso(r.from) : `${fmtIso(r.from)} a ${fmtIso(r.to)}`;
    lines.push(`• ${per}: ${r.evento} (${r.role})${r.local ? ' · ' + r.local : ''}`);
  });
  if (!runs.length) lines.push('', 'Nenhuma data marcada.');
  if (link) lines.push('', 'Acompanhe atualizado: ' + link);
  return lines.join('\n');
}
function copyText(t) {
  const done = () => toast('📋 Copiado.');
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { modal(`<h3>Copie o texto</h3><textarea class="ctl" style="width:100%;height:260px">${esc(t)}</textarea><div class="acts"><button class="btn" onclick="closeModal()">Fechar</button></div>`); }
  ta.remove();
}
function buildIcs(ag) {
  const e = s => String(s || '').replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
  const nx = iso => { const p = isoParts(iso); const d = new Date(p.y, p.m, p.d + 1); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Escala Tecnica//PT-BR', 'X-WR-CALNAME:' + e('Escala · ' + ag.nome)];
  ag.runs.forEach(r => L.push('BEGIN:VEVENT', 'UID:' + norm(r.evento + r.role + r.from).replace(/[^A-Z0-9]/g, '') + '@escala', 'DTSTAMP:20260101T000000Z',
    'DTSTART;VALUE=DATE:' + r.from.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + nx(r.to), 'SUMMARY:' + e(r.evento + ' · ' + r.role), 'LOCATION:' + e(r.local),
    'DESCRIPTION:' + e((r.os ? 'OS ' + r.os + '\n' : '') + r.days.map(d => fmtIso(d.date) + ' — ' + (d.phase || 'operação a definir')).join('\n')), 'END:VEVENT'));
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function downloadIcs() {
  const ag = S.person.ag; const blob = new Blob([buildIcs(ag)], { type: 'text/calendar' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agenda-' + norm(ag.nome).replace(/[^A-Z0-9]+/g, '-').toLowerCase() + '.ics';

/** Sugestão de operação: 1 dia = MONT/OP/DESMONT; vários dias = MONTAGEM → OPERAÇÃO → OP / DESMONTAGEM. */
function sugOp(e, d) {
  const all = e.activeDays, first = all[0], last = all[all.length - 1];
  const hasAny = all.some(x => phaseClass(e.phases[x - 1]));
  if (hasAny) return 'OPERAÇÃO';
  if (first === last) return 'MONT/OP/DESMONT';
  return d === first ? 'MONTAGEM' : d === last ? 'OP / DESMONTAGEM' : 'OPERAÇÃO';
}

function defaultPhases(s, e) {
  const out = {}; if (!s) return out;
  const D = S.data, first = s, last = e || s;
  for (let d = first; d <= last; d++) out[d] = first === last ? pickPhase('MONT/OP/DESMONT') : d === first ? pickPhase('MONTAGEM') : d === last ? pickPhase('OP / DESMONTAGEM') : pickPhase('OPERAÇÃO');
  return out;
}
function pickPhase(want) { const o = S.data.options.phases; return o.find(p => norm(p) === norm(want)) || want; }
function dayOfIso(iso) { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); return (y === S.data.year && m - 1 === S.data.month) ? d : null; }

function desenharQR(texto) {
  const pinta = () => {
    try { const q = qrcode(0, 'M'); q.addData(texto); q.make(); const b = $('#qrBox'); if (b) b.innerHTML = q.createSvgTag({ cellSize: 3, margin: 0, scalable: true }); }
    catch (e) { const b = $('#qrBox'); if (b) b.textContent = 'QR indisponível: use Copiar.'; }
  };
  if (window.qrcode) return pinta();
  const s = document.createElement('script');
  s.src = 'https:' + '\/\/cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  s.onload = pinta; s.onerror = () => { const b = $('#qrBox'); if (b) b.textContent = 'QR indisponível: use Copiar.'; };
  document.head.appendChild(s);
}
$('#btnFull').onclick = () => IS_CONTROLE ? instalarApp() : abrirControle();
$('#sheetSel').onchange = e => { S.sheet = e.target.value; S.assign.row = null; load(e.target.value); };
$('#btnStatus').onclick = fixStatus;
$('#btnMark').onclick = async () => {
  const r = await run('destacarConflitos', [S.sheet]);
  toast(r.conflicts ? `⚑ ${r.cells} célula(s) pintadas de vermelho na planilha. Use o menu “Limpar destaques” para desfazer.` : '✅ Nenhum conflito para marcar.');
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); closeModal(); } });

load();
</script>
